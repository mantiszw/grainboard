<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Demeter Grainboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#ffffff;
    --grid-line:#e8e8ec;
    --grid-line-strong:#d4d4da;
    --hour-text:#9a9aa5;
    --ink:#2a2a30;
    --ink-dim:#6a6a74;
    --header-bg:#fbfbfc;
    --now-line:#e04a3a;
    --accent:#b8860b;
    --lane-divider:#c9c9d0;
    --day-divider:#9aa0ae;   /* strong line between days */
    --grid2-tint:rgba(70,110,160,.055);  /* faint wash on Grid 2 half */
    --offhour:#f4f4f6;

    /* commodity colours — pastel (scheduled = striped, arrived = solid).
       Approximate Timely shades; adjust the hex pairs here to taste.
       Each commodity: --c-<x> base, used for both stripe and solid. */
    --c-wheat:#f2d64b;      /* wheat / ASW — yellow */
    --c-lentils:#7ec8ef;    /* lentils — sky blue */
    --c-oats:#b9a4e8;       /* oats — purple */
    --c-lupins:#f0a9a9;     /* lupins / speckled — red-pink */
    --c-canola:#6b6f76;     /* canola — dark grey */
    --c-barley:#4f8fd4;     /* barley — blue */
    --c-chickpeas:#8a9a3c;  /* chickpeas — olive green */
    --c-faba:#9cc4e8;       /* faba beans — light blue */
    --c-vetch:#2a2a2e;      /* vetch — black */
    --c-fibre:#d9e04b;      /* golden fibre — chartreuse */
    --c-peas:#86d49a;       /* field peas — green */
    --c-beans:#6aa9e0;      /* beans (generic) — blue */
    --c-hay:#bcd98a;        /* hay — pale green */
    --c-tbc:#c4c4cc;        /* unknown / TBC — grey */
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  html,body{height:100%}
  body{
    font-family:"Inter",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    color:var(--ink);background:var(--bg);
    display:flex;flex-direction:column;height:100vh;overflow:hidden;
    -webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;
    text-rendering:optimizeLegibility;
  }

  /* ---- Top bar ---- */
  .topbar{
    flex-shrink:0;display:flex;align-items:center;gap:14px;
    padding:10px 16px;border-bottom:1px solid var(--grid-line-strong);
    background:var(--header-bg);
  }
  .brand{font-size:15px;font-weight:800;letter-spacing:-0.01em;color:var(--ink);white-space:nowrap}
  .brand .sub{font-weight:600;color:var(--accent);margin-left:7px;font-size:12px;letter-spacing:0.02em}
  .brand .ver{font-weight:600;color:var(--ink-faint);margin-left:7px;font-size:10px;letter-spacing:0}
  .nav{display:flex;align-items:center;gap:4px}
  .navbtn{
    border:1px solid var(--grid-line-strong);background:#fff;border-radius:8px;
    width:32px;height:32px;display:flex;align-items:center;justify-content:center;
    cursor:pointer;color:var(--ink-dim);font-size:16px;
  }
  .navbtn:active{background:#f0f0f3}
  .weeklabel{font-size:13px;font-weight:700;color:var(--ink);min-width:150px;text-align:center}
  .today-btn{
    border:1px solid var(--grid-line-strong);background:#fff;border-radius:8px;
    padding:0 12px;height:32px;cursor:pointer;font-size:12.5px;font-weight:700;color:var(--ink-dim);
  }
  .today-btn:active{background:#f0f0f3}
  .viewtoggle{display:inline-flex;border:1px solid var(--grid-line-strong);border-radius:8px;overflow:hidden;margin-left:4px}
  .viewtoggle button{border:none;background:#fff;padding:0 12px;height:32px;cursor:pointer;
    font-size:12.5px;font-weight:700;color:var(--ink-dim);font-family:inherit}
  .viewtoggle button.on{background:var(--accent,#3f51b5);color:#fff}
  .viewtoggle button+button{border-left:1px solid var(--grid-line-strong)}
  .gridtoggle{display:inline-flex;border:1px solid var(--grid-line-strong);border-radius:8px;overflow:hidden}
  .gridtoggle button{border:none;background:#fff;padding:0 10px;height:32px;cursor:pointer;
    font-size:12px;font-weight:700;color:var(--ink-dim);font-family:inherit;white-space:nowrap}
  .gridtoggle button.on{background:var(--accent,#3f51b5);color:#fff}
  .gridtoggle button+button{border-left:1px solid var(--grid-line-strong)}
  .spacer{flex:1}
  .filters{display:flex;align-items:center;gap:8px}
  .filter-sel{
    border:1px solid var(--grid-line-strong);background:#fff;border-radius:8px;
    padding:0 10px;height:32px;font-size:12.5px;font-weight:600;color:var(--ink);
    font-family:inherit;cursor:pointer;
  }
  .status-dot{width:7px;height:7px;border-radius:50%;background:#3fb56b;display:inline-block;margin-right:5px}
  .synced{font-size:11.5px;color:var(--ink-dim);font-weight:600;white-space:nowrap}
  .refresh-btn{
    border:1px solid var(--grid-line-strong);background:#fff;border-radius:8px;
    width:32px;height:32px;cursor:pointer;font-size:16px;color:var(--ink-dim);line-height:1;
    display:flex;align-items:center;justify-content:center;font-family:inherit;
  }
  .refresh-btn:hover{background:#f0f0f3}
  .refresh-btn.spinning{animation:spin .8s linear infinite;color:var(--accent)}

  /* ---- Calendar scroll area ---- */
  .calwrap{flex:1;overflow:auto;position:relative}
  .cal{
    display:grid;
    /* time-gutter + N day columns set inline via JS */
    position:relative;min-width:max-content;
  }

  /* day header row (sticky) */
  .dayhead{
    position:sticky;top:0;z-index:30;background:var(--header-bg);
    border-bottom:1px solid var(--grid-line-strong);
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    padding:7px 4px 6px;border-left:2px solid var(--day-divider);
  }
  .dayhead:last-of-type{border-right:2px solid var(--day-divider)}
  /* day zebra removed — days separated by divider lines only, so the Grid 2
     tint inside each day isn't competing with a per-day shade */
  .dayhead.dayalt{background:var(--header-bg)}
  .dayhead.today{background:#fff7e6}
  .dayhead .dow{font-size:11px;font-weight:700;color:var(--ink-dim);text-transform:uppercase;letter-spacing:0.04em}
  .dayhead .dnum{font-size:17px;font-weight:800;color:var(--ink);line-height:1.1;margin-top:1px}
  .dayhead.today .dnum{color:var(--now-line)}
  .dayhead .lanes-mini{display:flex;gap:0;width:100%;margin-top:5px}
  .dayhead .lane-cap{
    flex:1;text-align:center;font-size:9.5px;font-weight:800;letter-spacing:0.05em;
    color:var(--ink-dim);text-transform:uppercase;padding:2px 0;
    border-top:1px solid var(--grid-line);
  }
  .dayhead .lane-cap:first-child{border-right:1px solid var(--lane-divider)}

  .corner{position:sticky;top:0;left:0;z-index:40;background:var(--header-bg);
    border-bottom:1px solid var(--grid-line-strong);border-right:1px solid var(--grid-line-strong);}

  /* time gutter */
  .timegutter{
    position:sticky;left:0;z-index:20;background:var(--bg);
    border-right:1px solid var(--grid-line-strong);
  }
  .hourlabel{
    position:relative;font-size:10.5px;color:var(--hour-text);font-weight:600;
    text-align:right;padding-right:7px;
  }
  .hourlabel span{position:absolute;top:-7px;right:7px;background:var(--bg);padding:0 2px}

  /* day column body */
  /* each day column gets a STRONG left edge = the day boundary; the lighter
     grid1/grid2 split inside a day is drawn by .lane.l2 */
  .daycol{position:relative;border-left:2px solid var(--day-divider);background:var(--bg)}
  .daycol:last-child{border-right:2px solid var(--day-divider)}
  .daycol.dayalt{background:var(--bg)}   /* zebra removed; days use divider lines */
  .daycol.today{background:#fffdf7}
  .daycol.weekend{background:#fafafb}
  /* the two lanes inside a day */
  .lane{position:absolute;top:0;bottom:0;z-index:0;pointer-events:none}
  .lane.l1{left:0;width:50%}
  /* Grid 2 gets a faint cool wash so the two grids read apart at a glance */
  .lane.l2{left:50%;width:50%;border-left:1px solid var(--lane-divider);background:var(--grid2-tint)}
  .lane.lfull{left:0;width:100%}                 /* single-grid view fills the column */
  .lane.lfull.l2full{background:var(--grid2-tint)}
  /* big faint grid-number watermark near the top of each grid column */
  .lane-wm{position:absolute;top:8px;left:50%;transform:translateX(-50%);
    font-size:40px;font-weight:800;color:rgba(90,110,140,.07);line-height:1;user-select:none}
  .hourline{position:absolute;left:0;right:0;border-top:1px solid var(--grid-line-strong)}
  .quarterline{position:absolute;left:0;right:0;border-top:1px solid #f1f1f4}
  .halfline{position:absolute;left:0;right:0;border-top:1px dashed #e4e4e9}
  .offhour{position:absolute;left:0;right:0;background:var(--offhour);
    background-image:repeating-linear-gradient(45deg,transparent,transparent 6px,rgba(0,0,0,.015) 6px,rgba(0,0,0,.015) 12px);}

  .nowline{position:absolute;left:0;right:0;height:2px;background:var(--now-line);z-index:15;pointer-events:none}
  .nowline::before{content:"";position:absolute;left:-4px;top:-3px;width:8px;height:8px;border-radius:50%;background:var(--now-line)}

  /* ---- Event block ---- */
  .ev{
    position:absolute;border-radius:4px;overflow:hidden;cursor:grab;
    padding:2px 7px;font-size:11px;line-height:1.25;
    border:1px solid rgba(0,0,0,.14);
    box-shadow:0 1px 1px rgba(0,0,0,.06);
    color:#1f1f26;user-select:none;touch-action:none;
    transition:box-shadow .12s;
    display:flex;flex-direction:column;justify-content:center;
  }
  .ev:active{cursor:grabbing}
  /* overlap = double-booking: just a thin white border separates the blocks */
  .ev.clash{border:1.5px solid #fff;box-shadow:0 0 0 1px rgba(0,0,0,.12)}
  /* a clashing block pops to FULL grid-half width on hover/tap so you can read
     it, then settles back — the quick way to read a double-booking */
  .ev[data-stack="1"]:hover, .ev[data-stack="1"].peek{
    left:calc(var(--gb,0%) + 1px) !important;
    width:calc(var(--gs,50%) - 2px) !important;
    z-index:95 !important;
    box-shadow:0 6px 20px rgba(0,0,0,.35);
  }
  .ev.dragging{opacity:.92;box-shadow:0 10px 26px rgba(0,0,0,.32);z-index:100;
    transition:none;cursor:grabbing;pointer-events:none}
  /* a short settle animation when the block is dropped into its final slot */
  .ev.settling{transition:top .13s cubic-bezier(.2,.8,.2,1), left .13s cubic-bezier(.2,.8,.2,1)}
  /* faint guide line showing the snapped drop position */
  .snap-guide{position:absolute;left:1px;right:1px;height:0;z-index:99;pointer-events:none;
    border-top:2px dashed rgba(37,99,201,.65)}
  .ev .title{font-weight:700;letter-spacing:-.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding-right:52px;font-size:11.5px}
  /* per-booking tag pill beside the name (e.g. "25t") — this load only */
  .ev-tag{display:inline-block;margin-left:5px;padding:0 5px;border-radius:7px;
    font-size:9.5px;font-weight:700;letter-spacing:-.01em;vertical-align:1px;
    background:rgba(0,0,0,.14);color:inherit;white-space:nowrap}
  .ev.darktext .ev-tag{background:rgba(255,255,255,.26)}
  .ev.clash .ev-tag{font-size:8px;margin-left:3px;padding:0 3px}
  .ev .sub{font-weight:500;opacity:.9;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:10px}
  .ev .tm{font-weight:500;opacity:.7;font-size:9.5px;white-space:nowrap}
  /* clash (narrow) blocks: tiny text + wrap so the whole name shows
     — "Millstone Ops"/"Schilling Holdings" instead of just "M…"/"S…" */
  .ev.clash{padding:3px 4px}
  .ev.clash .title{font-size:9px;line-height:1.05;padding-right:0;letter-spacing:-.02em;
    white-space:normal;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;
    text-overflow:clip;margin-top:9px}
  .ev.clash .sub{font-size:8px;white-space:normal;line-height:1.05}
  .ev.clash .tm{font-size:7.5px}
  .ev.clash .ev-trans{font-size:5px;padding:1px 2px;max-width:none;letter-spacing:0}
  /* when a clash block is peeked/hovered to full width, restore normal sizing */
  .ev.clash:hover .title, .ev.clash.peek .title{font-size:inherit;padding-right:46px;
    white-space:nowrap;-webkit-line-clamp:unset;margin-top:0;display:block;text-overflow:ellipsis}
  .ev.clash:hover .sub, .ev.clash.peek .sub{font-size:9.5px;white-space:nowrap}
  .ev.clash:hover .ev-trans, .ev.clash.peek .ev-trans{font-size:6.5px;padding:1px 4px}
  /* transporter ribbon — top-right corner, colour-coded per transporter */
  .ev-trans{
    position:absolute;top:0;right:0;z-index:3;
    font-size:7.5px;font-weight:800;letter-spacing:.03em;line-height:1.3;
    padding:1px 5px;border-radius:0 3px 0 6px;
    color:#fff;text-transform:uppercase;
    max-width:80%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
    box-shadow:-1px 1px 2px rgba(0,0,0,.2);
  }
  /* driver badge — bottom-right corner */
  .ev-driver{
    position:absolute;bottom:1px;right:2px;z-index:2;
    font-size:7px;font-weight:800;letter-spacing:0.01em;line-height:1.2;
    padding:0px 3px;border-radius:3px;
    background:rgba(0,0,0,.22);color:#fff;
    max-width:60%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
  }
  .ev.darktext .ev-driver{background:rgba(255,255,255,.28)}
  /* on very short blocks, drop the driver so it doesn't collide with the ribbon */
  .ev.compact .ev-driver{display:none}
  /* cancelled load: stays on the board, greyed + struck through + a big X */
  .ev.cancelled{opacity:.62;filter:grayscale(.55)}
  .ev.cancelled .title,.ev.cancelled .sub,.ev.cancelled .tm{text-decoration:line-through}
  .ev.cancelled::after{content:"";position:absolute;inset:0;pointer-events:none;
    background:
      linear-gradient(to top right, transparent calc(50% - 1px), rgba(180,40,40,.75) 50%, transparent calc(50% + 1px)),
      linear-gradient(to bottom right, transparent calc(50% - 1px), rgba(180,40,40,.75) 50%, transparent calc(50% + 1px));}
  .ev.cancelled .cxtag{position:absolute;bottom:1px;left:3px;z-index:3;font-size:7px;font-weight:800;
    letter-spacing:.04em;color:#fff;background:#b42828;padding:0 4px;border-radius:3px}
  /* busy / blocked time: grey diagonal hatch, no fill colour */
  .ev.busy{
    color:#555;z-index:1;border:1px dashed rgba(0,0,0,.35);
    background-image:repeating-linear-gradient(45deg,
      rgba(120,120,128,.26) 0, rgba(120,120,128,.26) 6px,
      rgba(120,120,128,.10) 6px, rgba(120,120,128,.10) 12px);
    box-shadow:none;
  }
  .ev.busy .title{font-weight:800;letter-spacing:.02em;text-transform:uppercase;font-size:9.5px}
  .ev.busy .tm{opacity:.7}
  .cxlbl{font-size:12px;font-weight:600;color:var(--ink-dim);display:flex;align-items:center;gap:5px;white-space:nowrap;cursor:pointer}
  .cxlbl input{cursor:pointer}
  /* hide sub-lines on short (15-min) blocks; show on taller ones */
  .ev.compact .sub, .ev.compact .tm{display:none}
  /* resize handle on the bottom edge */
  .resize-handle{
    position:absolute;left:0;right:0;bottom:0;height:7px;cursor:ns-resize;
    touch-action:none;
  }
  .resize-handle::after{
    content:"";position:absolute;left:50%;bottom:1px;transform:translateX(-50%);
    width:22px;height:3px;border-radius:3px;background:rgba(0,0,0,.22);
    opacity:0;transition:opacity .12s;
  }
  .ev:hover .resize-handle::after{opacity:1}
  .ev.resizing{box-shadow:0 4px 14px rgba(0,0,0,.22);z-index:100}

  /* Timely-style: pale tint of the commodity colour + dark text + a coloured
     left bar so the commodity is still identifiable. Calmer on a full day. */
  .ev{border-left:4px solid var(--evc)}
  /* scheduled = soft stripe; arrived = solid tint. A bit stronger than pastel
     so blocks stand out from the grid, still dark text for readability. */
  .ev.sched{
    background-image:repeating-linear-gradient(45deg,
      color-mix(in srgb, var(--evc) 55%, #ffffff) 0, color-mix(in srgb, var(--evc) 55%, #ffffff) 9px,
      color-mix(in srgb, var(--evc) 36%, #ffffff) 9px, color-mix(in srgb, var(--evc) 36%, #ffffff) 18px);
  }
  .ev.arrived{background:color-mix(in srgb, var(--evc) 60%, #ffffff)}
  .ev .sub{color:#2a2a30;opacity:.92}   /* commodity line — solid dark so it's always readable */
  /* very dark commodities (vetch black, canola grey): keep the tint lighter so
     dark text still reads */
  .ev.darktext{color:#1f1f26}
  .ev.darktext .sub, .ev.darktext .tm{color:#33333b;opacity:1}
  .ev.darktext.sched{
    background-image:repeating-linear-gradient(45deg,
      color-mix(in srgb, var(--evc) 42%, #ffffff) 0, color-mix(in srgb, var(--evc) 42%, #ffffff) 9px,
      color-mix(in srgb, var(--evc) 27%, #ffffff) 9px, color-mix(in srgb, var(--evc) 27%, #ffffff) 18px);
  }
  .ev.darktext.arrived{background:color-mix(in srgb, var(--evc) 48%, #ffffff)}

  /* drop target highlight */
  .daycol.drop-ok{background:#eef7ff}

  /* toast */
  .toast{
    position:fixed;left:50%;bottom:22px;transform:translateX(-50%) translateY(60px);
    background:#2a2a30;color:#fff;padding:9px 16px;border-radius:9px;font-size:13px;font-weight:600;
    box-shadow:0 6px 24px rgba(0,0,0,.3);opacity:0;transition:all .2s;z-index:200;pointer-events:none;
  }
  .toast.show{transform:translateX(-50%) translateY(0);opacity:1}
  .toast.err{background:#c43d3d}

  /* loading / empty states */
  .state{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;
    color:var(--ink-dim);gap:12px;text-align:center;padding:30px}
  .spinner{width:28px;height:28px;border:3px solid var(--grid-line);border-top-color:var(--accent);border-radius:50%;animation:spin .8s linear infinite}
  @keyframes spin{to{transform:rotate(360deg)}}
  .state h2{font-size:15px;color:var(--ink);font-weight:700}
  .state p{font-size:13px;max-width:360px;line-height:1.5}

  /* legend */

  @media(max-width:640px){
    .brand .sub{display:none}
    .weeklabel{min-width:90px;font-size:12px}
  }

  /* ---- Edit popup ---- */
  .modal-backdrop{position:fixed;inset:0;background:rgba(20,20,25,.4);z-index:300;
    display:flex;align-items:flex-start;justify-content:center;padding:40px 14px;overflow:auto}
  .modal{background:#fff;border-radius:14px;width:100%;max-width:560px;
    box-shadow:0 20px 60px rgba(0,0,0,.35);overflow:hidden}
  .m-head{display:flex;align-items:center;justify-content:space-between;
    padding:16px 20px;border-bottom:1px solid var(--grid-line)}
  .m-title{font-size:16px;font-weight:800;color:var(--ink)}
  .m-close{border:none;background:none;font-size:22px;color:var(--ink-dim);cursor:pointer;line-height:1;padding:0 4px}
  .m-tabs{display:flex;gap:18px;padding:12px 20px 0}
  .m-tab{font-size:13px;font-weight:700;color:var(--ink-dim);padding-bottom:9px;cursor:pointer;border-bottom:2px solid transparent}
  .m-tab.active{color:var(--accent);border-bottom-color:var(--accent)}
  .m-body{padding:16px 20px}
  .m-field{display:flex;align-items:center;gap:10px;margin-bottom:14px}
  .m-field .ic{width:18px;color:var(--ink-faint);flex-shrink:0;text-align:center}
  .trans-chip{flex-shrink:0;color:#fff;font-weight:800;font-size:10px;letter-spacing:.03em;
    text-transform:uppercase;padding:2px 7px;border-radius:4px;white-space:nowrap}
  .m-field input.lineinput{border:none;border-bottom:1px solid transparent;font-size:15px;font-weight:700;color:var(--ink);font-family:inherit;padding:2px 2px;flex:1;min-width:0}
  .m-field.two-col{gap:8px}
  .m-field.two-col input.lineinput{font-size:13.5px;font-weight:600;border-bottom:1px solid var(--grid-line)}
  .m-field input.lineinput:hover{border-bottom-color:var(--grid-line-strong)}
  .m-field input.lineinput:focus{outline:none;border-bottom-color:var(--accent)}
  .service{border:1px solid var(--grid-line-strong);border-radius:10px;padding:11px;margin-bottom:10px;position:relative}
  .service .srow{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
  .service select,.service input{border:1px solid var(--grid-line-strong);border-radius:8px;
    padding:7px 9px;font-size:13px;font-family:inherit;color:var(--ink);background:#fff}
  .service select.commodity-sel{flex:2;min-width:150px}
  .service select.grid-sel{width:92px}
  .service input.time-in{width:92px}
  .service select.dur-sel{width:92px}
  .service .rm{position:absolute;top:8px;right:9px;border:none;background:none;color:var(--ink-faint);font-size:16px;cursor:pointer;line-height:1}
  .swatch-dot{width:12px;height:12px;border-radius:3px;border:1px solid rgba(0,0,0,.15);flex-shrink:0}
  /* add-commodity colour picker */
  .col-grid{display:grid;grid-template-columns:repeat(9,1fr);gap:8px;margin-top:8px}

<script>
/* ============================================================
   CONFIG — one entry per transporter sheet.
   Fill `url` with each sheet's Apps Script Web App URL (ends /exec).
   Until URLs are added, the app runs on DEMO data.
   ============================================================ */
/*
  Each entry is a BOOKING TYPE shown in the transporter picker, with its own
  ribbon label (short) and colour. `url` is the Apps Script of the sheet that
  stores its rows. Several types can share ONE catch-all sheet (same url) —
  the type is still recorded per row (in the Transporter column) so the ribbon
  stays correct. M&K and Marleys get their own sheets; everything else
  (Growers own, Delivered, country sites) can share one "Other" sheet that
  you never have to open.
*/
const OTHER_URL = "https://script.google.com/macros/s/AKfycbz_JyXw5sNAVoIKTwx_h7zZvioBdD0L6En3HwI48oWJUChcRTzeu1YcBvDT1OC5Vghv/exec";   // one catch-all sheet for the rest (Own, Delivered, country sites)
const SHEETS = [
  { key:"MK",       name:"M&K Bulk Transport",     short:"M&K",   color:"#2563c9", url:"https://script.google.com/macros/s/AKfycbwQ7KknnYntj7oz859R2u_HueNXXyc8-W0o3LOBqNjGPlUxl_vQiny78NqJmaYMD-nvJA/exec" },
  { key:"MARLEYS",  name:"Marleys",                short:"MARLEYS",color:"#cc2b2b", url:"https://script.google.com/macros/s/AKfycbw1yCJymg-OX8Cu7vjQdQvhc6mOKcPbjthcLZE36HDyGksK6WdbPqCV9ylpeCABrWhM/exec" },

  { key:"WAGIN",    name:"Wagin (country site)",    short:"WAGIN",color:"#b5523f", url:OTHER_URL },
  { key:"WILLIAMS", name:"Williams (country site)", short:"WILL", color:"#7a8b2e", url:OTHER_URL },
  { key:"GURWINDER",name:"Gurwinder Transport",     short:"GURW", color:"#8e44ad", url:OTHER_URL },

];
function sheetMeta(key){ return SHEETS.find(s=>s.key===key) || {short:key, color:"#9aa0a6", name:key}; }

/* commodity → colour var. Matched loosely (lowercase contains). */
const COMMODITY_COLORS = [
  { match:["wheat","asw","aph","apw","ah","agp"], var:"--c-wheat"    },
  { match:["lentil"],                   var:"--c-lentils"  },
  { match:["oat"],                      var:"--c-oats"     },
  { match:["lupin","speckled"],         var:"--c-lupins"   },
  { match:["canola"],                   var:"--c-canola"   },
  { match:["barley"],                   var:"--c-barley"   },
  { match:["fibre","fiber","golden"],   var:"--c-fibre"    },
  { match:["faba","fava"],              var:"--c-faba"     },
  { match:["chickpea","chick pea","cp"],var:"--c-chickpeas"},
  { match:["pea"],                      var:"--c-peas"     },  // after chickpea so it doesn't swallow it
  { match:["vetch"],                    var:"--c-vetch"    },
  { match:["hay"],                      var:"--c-hay"      },
  { match:["bean"],                     var:"--c-beans"    },  // generic beans last
];
/* commodities whose fill is dark → use light text */
const DARK_COMMODITY_VARS = ["--c-vetch","--c-canola"];
// decide white vs dark text: dark built-in vars, or a dark custom hex
function isDarkColor(cvar){
  if(typeof cvar!=="string") return false;
  if(cvar.startsWith("var(")) return DARK_COMMODITY_VARS.some(v=>cvar.includes(v));
  const m=cvar.match(/^#?([0-9a-f]{6})$/i);
  if(!m) return false;
  const n=parseInt(m[1],16), r=(n>>16)&255, g=(n>>8)&255, b=n&255;
  // relative luminance; <140 → treat as dark
  return (0.299*r+0.587*g+0.114*b) < 140;
}
// custom commodity colours chosen by staff (per-browser), name(lower) → hex
let CUSTOM_COMMODITY_COLORS = {};
function loadCustomColors(){
  try{ CUSTOM_COMMODITY_COLORS = JSON.parse(localStorage.getItem("dispatch_commodity_colors")||"{}")||{}; }
  catch(e){ CUSTOM_COMMODITY_COLORS={}; }
}
function saveCustomColor(name, hex){
  if(!name||!hex) return;
  CUSTOM_COMMODITY_COLORS[name.trim().toLowerCase()]=hex;
  try{ localStorage.setItem("dispatch_commodity_colors", JSON.stringify(CUSTOM_COMMODITY_COLORS)); }catch(e){}
}
/* returns a CSS colour VALUE for a commodity (custom hex wins, else the
   matched palette var resolved to its value, else grey). */
function commodityVar(c){
  const s=(c||"").toLowerCase().trim();
  // exact custom-colour match (by commodity name, grade stripped)
  const base = s.split(" — ")[0].split(" - ")[0].trim();
  if(CUSTOM_COMMODITY_COLORS[base]) return CUSTOM_COMMODITY_COLORS[base];
  if(CUSTOM_COMMODITY_COLORS[s])    return CUSTOM_COMMODITY_COLORS[s];
  for(const row of COMMODITY_COLORS){ if(row.match.some(m=>s.includes(m))) return `var(${row.var})`; }
  return "var(--c-tbc)";
}

/* ---- commodity + grade catalogue (used by the edit popup's dropdown) ----
   Base commodity drives colour; grade is the sub-option. Staff can add more
   (stored per-browser in localStorage, merged over these defaults). */
const COMMODITY_CATALOGUE = [
  { name:"Oats",        grades:["OAT1","OAT2","OAT3","Undergrade"] },
  { name:"Lentils",     grades:["Nipper","Nugget"] },
  { name:"Lupins",      grades:[] },
  { name:"Canola",      grades:[] },
  { name:"Faba Beans",  grades:[] },
  { name:"Vetch",       grades:[] },
  { name:"Barley",      grades:[] },
  { name:"Wheat",       grades:[] },
  { name:"Chickpeas",   grades:[] },
];
function loadCatalogue(){
  try{
    const extra=JSON.parse(localStorage.getItem("dispatch_catalogue")||"[]");
    if(Array.isArray(extra)&&extra.length){
      const byName={}; COMMODITY_CATALOGUE.forEach(c=>byName[c.name.toLowerCase()]=c);
      extra.forEach(c=>{
        if(!c||!c.name) return;
        const k=c.name.toLowerCase();
        if(byName[k]){ // merge grades
          (c.grades||[]).forEach(g=>{ if(!byName[k].grades.includes(g)) byName[k].grades.push(g); });
        }else{ COMMODITY_CATALOGUE.push({name:c.name,grades:c.grades||[]}); byName[k]=c; }
      });
    }
  }catch(e){}
}
function saveCatalogueAddition(name, grades){
  try{
    const extra=JSON.parse(localStorage.getItem("dispatch_catalogue")||"[]");
    extra.push({name, grades:grades||[]});
    localStorage.setItem("dispatch_catalogue", JSON.stringify(extra));
  }catch(e){}
}

/* build the flat option list for the dropdown: "Commodity" and "Commodity — Grade" */
function commodityOptions(){
  const out=[];
  COMMODITY_CATALOGUE.forEach(c=>{
    if(c.grades && c.grades.length){
      c.grades.forEach(g=> out.push({label:c.name+" — "+g, commodity:c.name, grade:g}));
    }else{
      out.push({label:c.name, commodity:c.name, grade:""});
    }
  });
  return out;
}

// seed the in-memory directory from the preinstalled database immediately,
// so autocomplete works before (and regardless of) any sheet fetch
function seedGrowers(){
  const dir={};
  SEED_GROWERS.forEach(g=>{ const k=dirKey(g); if(k) dir[k]=g; });
  STATE.growers=dir;
  buildFarmList();
}
// build the shared autocomplete <datalist> ONCE (not on every editor open —
// 1,271 options rebuilt each time made opening a booking slow)
let _farmListSig="";
function buildFarmList(){
  const dl=document.getElementById("farmList");
  if(!dl) return;
  const vals=Object.values(STATE.growers);
  const sig=vals.length+"";                 // cheap change check
  if(sig===_farmListSig && dl.children.length) return;
  _farmListSig=sig;
  const frag=document.createDocumentFragment();
  vals.forEach(g=>{
    const o=document.createElement("option");
    o.value=g.release||g.site||"";
    if(g.site&&g.release) o.label=g.site;
    frag.appendChild(o);
  });
  dl.innerHTML=""; dl.appendChild(frag);
}
async function loadGrowers(){
  const dir={};
  // 1) seed from any preinstalled database first
  SEED_GROWERS.forEach(g=>{ const k=dirKey(g); if(k) dir[k]=g; });
  // 2) overlay anything the live sheets' Growers tabs hold
  const live = SHEETS.filter(s=>s.url && !s.url.startsWith("PASTE_"));
  const seenUrl={}; const uniq=[];
  live.forEach(s=>{ if(!seenUrl[s.url]){ seenUrl[s.url]=1; uniq.push(s); } });
  await Promise.all(uniq.map(async s=>{
    try{
      const res=await fetch(s.url+"?growers=1&_cb="+Date.now(), {redirect:"follow"});
      const data=await res.json();
      if(data.ok && data.growers){
        data.growers.forEach(g=>{ const k=dirKey(g); if(k) dir[k]={...(dir[k]||{}), ...g}; });
      }
    }catch(e){ console.warn("[dispatch] grower load fail:", s.name, e); }
  }));
  STATE.growers=dir;
  buildFarmList();
}
// look up by farm/release name (the lead field). Falls back to grower name.
function growerByFarm(farm){
  if(!farm) return null;
  return STATE.growers[String(farm).trim().toLowerCase()] || null;
}
// push a grower back to its sheet's directory (fire-and-forget upsert)
function saveGrower(url, g){
  const k=dirKey(g);
  if(k) STATE.growers[k]={...(STATE.growers[k]||{}), ...g};  // keep in-memory current
  if(!url || url.startsWith("PASTE_")) return;   // demo / unsynced — skip write
  postAction(url, { action:"saveGrower", grower:g }).catch(()=>{});
}

/* ---------- date helpers ---------- */
function startOfWeek(d){ // Monday
  const x=new Date(d); x.setHours(0,0,0,0);
  const dow=x.getDay(); const off=(dow===0?-6:1-dow);
  x.setDate(x.getDate()+off); return x;
}
function addDays(d,n){ const x=new Date(d); x.setDate(x.getDate()+n); return x; }
function sameDay(a,b){ return a.getFullYear()===b.getFullYear()&&a.getMonth()===b.getMonth()&&a.getDate()===b.getDate(); }
function dayKey(d){ return d.getFullYear()*10000+d.getMonth()*100+d.getDate(); }

/* parse a date cell: ISO (from script), "Mon 26 Oct", "26/10/2026", "Monday 26 October, 2026" */
function parseDate(s){
  if(!s) return null;
  if(s instanceof Date) return s;
  s=String(s).trim();
  // ISO yyyy-mm-ddThh:mm:ss or yyyy-mm-dd
  let m=s.match(/^(\d{4})-(\d{2})-(\d{2})/);
  if(m) return new Date(+m[1],+m[2]-1,+m[3]);
  // dd/mm/yyyy
  m=s.match(/^(\d{1,2})[\/](\d{1,2})[\/](\d{4})/);
  if(m) return new Date(+m[3],+m[2]-1,+m[1]);
  // "Mon 26 Oct" / "Monday 26 October, 2026" / "26 Oct"
  m=s.match(/(\d{1,2})\s+([A-Za-z]{3,})/);
  if(m){
    const day=+m[1];
    const mon=MONTHS.findIndex(x=>m[2].toLowerCase().startsWith(x.toLowerCase()));
    if(mon>=0){
      const ym=s.match(/(\d{4})/);
      const year=ym?+ym[1]:guessYear(mon,day);
      return new Date(year,mon,day);
    }
  }
  const d=new Date(s); return isNaN(d)?null:d;
}
function guessYear(mon,day){
  const now=new Date(), y=now.getFullYear();
  let best=y,bd=1e15;
  [y-1,y,y+1].forEach(yr=>{const diff=Math.abs(new Date(yr,mon,day)-now);if(diff<bd){bd=diff;best=yr;}});
  return best;
}
/* parse a time cell → minutes since midnight. Handles "3:00 pm", ISO datetime, "14:30". */
function parseTimeMin(s){
  if(!s) return null;
  s=String(s).trim();
  // A time typed straight into Google Sheets comes back on the 1899-12-30
  // epoch date (e.g. "1899-12-30T13:00:00") — that's a REAL time, so read it.
  // Only the midnight placeholder (00:00:00) means "no time set" → hide it.
  const is1899 = /1899/.test(s) || /30\/12\/1899/.test(s);
  // ISO / sheet datetime → take the HH:mm time part
  let m=s.match(/T(\d{2}):(\d{2})/);
  if(m){
    const mins=(+m[1])*60 + (+m[2]);
    if(is1899 && mins===0) return null;   // 1899 midnight = empty-time placeholder
    return mins;
  }
  if(is1899) return null;                 // 1899 with no parseable time → no time
  m=s.match(/^(\d{1,2}):(\d{2})\s*([AaPp][Mm])?/);
  if(!m) return null;
  let h=+m[1], min=+m[2], ap=(m[3]||"").toUpperCase();
  if(ap==="AM"){ if(h===12)h=0; } else if(ap==="PM"){ if(h!==12)h+=12; }
  return h*60+min;
}
function minToLabel(min){
  let h=Math.floor(min/60), m=min%60;
  const ap=h<12?"am":"pm"; let h12=h%12; if(h12===0)h12=12;
  return h12+":"+String(m).padStart(2,"0")+ap;
}
function minToSheetTime(min){
  let h=Math.floor(min/60), m=min%60;
  const ap=h<12?"AM":"PM"; let h12=h%12; if(h12===0)h12=12;
  return h12+":"+String(m).padStart(2,"0")+" "+ap;
}

/* ---------- data load ---------- */
async function loadAll(){
  seedGrowers();   // preinstalled grower directory available immediately
  const live = SHEETS.filter(s=>s.url && !s.url.startsWith("PASTE_"));
  if(!live.length){
    STATE.jobs = DEMO_JOBS();
    STATE.loadedOnce = true;
    buildTransporterFilter();
    render();
    setSynced("Demo data — connect sheets to go live", false);
    return;
  }
  setSynced("Loading…", null);
  loadGrowers();   // refresh the grower directory in the background
  const all=[];
  let anyFail=false, lastErr="";
  // fetch each UNIQUE sheet url once (several booking types can share one sheet)
  const seenUrl={}; const uniq=[];
  live.forEach(s=>{ if(!seenUrl[s.url]){ seenUrl[s.url]=1; uniq.push(s); } });
  await Promise.all(uniq.map(async s=>{
    try{
      const res=await fetch(s.url+"?_cb="+Date.now(), {redirect:"follow"});
      const text=await res.text();
      let data;
      try{ data=JSON.parse(text); }
      catch(pe){ throw new Error("Non-JSON from "+s.name+": "+text.slice(0,120)); }
      if(data.ok && data.rows){
        data.rows.forEach(r=>{ all.push(normalise(r, s)); });
      } else {
        throw new Error(s.name+" returned ok=false: "+(data.error||"unknown"));
      }
    }catch(e){ anyFail=true; lastErr=String(e&&e.message||e); console.error("[dispatch] load fail:", s.name, e); }
  }));
  STATE.jobs=all.filter(Boolean);
  STATE.loadedOnce=true;
  buildTransporterFilter();
  render();
  const now=new Date();
  const label = anyFail
    ? ("Sync error — "+(lastErr?lastErr.slice(0,60):"check console"))
    : ("Synced · "+now.toLocaleTimeString("en-AU",{hour:"numeric",minute:"2-digit"}));
  setSynced(label, !anyFail);
  if(anyFail) console.warn("[dispatch] "+STATE.jobs.length+" jobs loaded; last error:", lastErr);
}

function normalise(r, sheet){
  const td=parseDate(r.tipDate) || parseDate(r.pickup);
  const tmin=parseTimeMin(r.tipTime);
  const busy = /^busy$/i.test((r.commodity||"").trim());
  // grid: "BOTH" → 3 (spans both), "2" → 2, else 1
  const gRaw = String(r.grid||"").trim().toUpperCase();
  const grid = gRaw==="BOTH"?3 : (gRaw==="2"?2:1);
  // a shared "Other" sheet tags each row with its booking type in the
  // Transporter column; use it for the ribbon/colour if it names a known type.
  let key = sheet.key;
  const tkey = String(r.transporter||"").trim().toUpperCase();
  if(tkey && SHEETS.some(s=>s.key===tkey)) key = tkey;
  return {
    id:r.id, sheetKey:key, sheetName:sheetMeta(key).name, url:sheet.url,
    site:r.site||"", commodity:r.commodity||"", release:r.release||"",
    status:r.status||"", driver:r.driver||"", note:r.note||"", tag:r.tag||"",
    grid:grid,                                    // blank/anything else → Grid 1
    grade:r.grade||"",
    apptStatus:r.apptStatus||"",
    isBusy:busy,
    duration: durFrom(r.duration),                // minutes; default 45
    tipDate:td, tipMin:(tmin==null?null:tmin),
    arrived:/arriv/i.test(r.status||""),          // solid state hook (off for now unless status says arrived)
    _raw:r
  };
}

/* ---------- rendering ---------- */
function setSynced(txt, ok){
  document.getElementById("syncedText").textContent=txt;
  const dot=document.getElementById("statusDot");
  dot.style.background = ok===false ? "#cf7626" : ok===null ? "#c4c4cc" : "#3fb56b";
}
function buildTransporterFilter(){
  const sel=document.getElementById("transporterFilter");
  const have=[...new Set(STATE.jobs.map(j=>j.sheetKey))];
  // keep All + one option per sheet present
  sel.innerHTML='<option value="__ALL__">All transporters</option>'+
    SHEETS.filter(s=>have.includes(s.key)).map(s=>`<option value="${s.key}">${s.name}</option>`).join("");
  sel.value=STATE.filter;
}
function buildLegend(){/* legend removed */}

function render(){
  const cal=document.getElementById("cal");
  document.getElementById("state").style.display = STATE.jobs.length||STATE.loadedOnce ? "none":"flex";

  const dayView = STATE.view==="day";
  let days;
  if(dayView){
    const d=STATE.dayDate;
    days=[new Date(d)];
    document.getElementById("weeklabel").textContent=
      `${WD[d.getDay()]} ${d.getDate()} ${MONTHS[d.getMonth()]} ${d.getFullYear()}`;
  } else {
    days=[...Array(7)].map((_,i)=>addDays(STATE.weekStart,i));
    const ws=STATE.weekStart, we=addDays(ws,6);
    document.getElementById("weeklabel").textContent=
      `${ws.getDate()} ${MONTHS[ws.getMonth()]} – ${we.getDate()} ${MONTHS[we.getMonth()]}`;
  }

  const bodyH=(DAY_END-DAY_START)*HOUR_PX;
  cal.style.gridTemplateColumns= dayView
    ? `${GUTTER_PX}px minmax(260px, 1fr)`
    : `${GUTTER_PX}px repeat(7, minmax(150px, 1fr))`;
  cal.style.gridTemplateRows=`auto ${bodyH}px`;

  // ---- header row ----
  let html=`<div class="corner"></div>`;
  days.forEach((d,di)=>{
    const today=sameDay(d,new Date());
    const alt=(di%2===1)?" dayalt":"";
    html+=`<div class="dayhead${today?" today":""}${alt}">
      <span class="dow">${WD[d.getDay()]}</span>
      <span class="dnum">${d.getDate()}</span>
      ${STATE.gridFilter===0
        ? `<div class="lanes-mini"><span class="lane-cap">Grid 1</span><span class="lane-cap">Grid 2</span></div>`
        : `<div class="lanes-mini"><span class="lane-cap" style="flex:1">Grid ${STATE.gridFilter}</span></div>`}
    </div>`;
  });

  // ---- time gutter ----
  html+=`<div class="timegutter" style="height:${bodyH}px">`;
  for(let h=DAY_START;h<=DAY_END;h++){
    const top=(h-DAY_START)*HOUR_PX;
    const hh=h%24; const lab=(hh%12===0?12:hh%12)+((hh<12)?"am":"pm");
    html+=`<div class="hourlabel" style="position:absolute;top:${top}px;right:0;width:100%"><span>${lab}</span></div>`;
  }
  html+=`</div>`;

  // ---- day columns ----
  const nowMin=new Date().getHours()*60+new Date().getMinutes();
  const filtered=STATE.jobs.filter(j=>
    (STATE.filter==="__ALL__"||j.sheetKey===STATE.filter) &&
    // cancelled loads stay visible (struck through) by default; hide only if toggled
    (!STATE.hideCancelled || !/^cancel/i.test(j.apptStatus||""))
  );

  days.forEach((d,di)=>{
    const today=sameDay(d,new Date());
    const weekend=(d.getDay()===0||d.getDay()===6);
    const alt=(di%2===1)?" dayalt":"";   // zebra-shade alternate days
    html+=`<div class="daycol${today?" today":""}${weekend?" weekend":""}${alt}" data-daykey="${dayKey(d)}" style="height:${bodyH}px">`;
    // hour lines
    for(let h=DAY_START;h<=DAY_END;h++){
      const top=(h-DAY_START)*HOUR_PX;
      html+=`<div class="hourline" style="top:${top}px"></div>`;
      if(h<DAY_END){
        // 15, 30, 45 min lines — :30 slightly stronger
        html+=`<div class="quarterline" style="top:${top+HOUR_PX*0.25}px"></div>`;
        html+=`<div class="halfline" style="top:${top+HOUR_PX*0.5}px"></div>`;
        html+=`<div class="quarterline" style="top:${top+HOUR_PX*0.75}px"></div>`;
      }
    }
    // lane containers: show both, or only the chosen grid (full width)
    const gf=STATE.gridFilter;
    if(gf===0){
      html+=`<div class="lane l1"><span class="lane-wm">1</span></div><div class="lane l2"><span class="lane-wm">2</span></div>`;
    } else if(gf===1){
      html+=`<div class="lane lfull"><span class="lane-wm">1</span></div>`;
    } else {
      html+=`<div class="lane lfull l2full"><span class="lane-wm">2</span></div>`;
    }
    // now line
    if(today && nowMin>=DAY_START*60 && nowMin<=DAY_END*60){
      const top=((nowMin-DAY_START*60)/60)*HOUR_PX;
      html+=`<div class="nowline" style="top:${top}px"></div>`;
    }
    // events for this day — laid out per grid, overlaps fan out side-by-side
    const dayJobs=filtered.filter(j=>j.tipDate && dayKey(j.tipDate)===dayKey(d) && j.tipMin!=null);
    // busy bands drawn first (behind), then normal loads
    dayJobs.filter(j=>j.isBusy && (gf===0||j.grid===gf||j.grid===3)).forEach(j=>{ html+=busyHTML(j, gf); });
    const grids = gf===0 ? [1,2] : [gf];
    grids.forEach(gridNo=>{
      const gj=dayJobs.filter(j=>!j.isBusy && j.grid===gridNo);
      const laid=layoutOverlaps(gj);     // assigns {col,cols} to each
      laid.forEach(({job,col,cols})=>{ html+=eventHTML(job,gridNo,col,cols,gf!==0); });
    });
    html+=`</div>`;
  });

  cal.innerHTML=html;
  attachDrag();
  attachEmptyClick();
}

/* click an empty part of a day column → new booking (or place a duplicate/move) */
let PLACING=null;   // { mode:"copy"|"move", job } while waiting for a target click
function attachEmptyClick(){
  document.querySelectorAll(".daycol").forEach(col=>{
    col.addEventListener("click",(e)=>{
      if(e.target.closest(".ev")) return;        // ignore clicks on events
      document.querySelectorAll(".ev.peek").forEach(el=>el.classList.remove("peek")); // collapse any peeked clash
      const rect=col.getBoundingClientRect();
      const yInside=e.clientY-rect.top;
      let min=DAY_START*60 + Math.round((yInside/HOUR_PX*60)/SLOT_MIN)*SLOT_MIN;
      min=Math.max(DAY_START*60, Math.min(DAY_END*60-SLOT_MIN, min));
      // single-grid view → use that grid; both-grid view → left/right half
      const grid = STATE.gridFilter!==0 ? STATE.gridFilter : ((e.clientX-rect.left) > rect.width/2 ? 2 : 1);
      const date=dateFromKey(+col.dataset.daykey);
      if(PLACING){ placeHere(date, min, grid); return; }
      openNewBooking(date, min, grid);
    });
  });
}

/* ---- Duplicate / Reschedule: click-to-place ---- */
function startDuplicate(){ beginPlacing("copy"); }
function startReschedule(){ beginPlacing("move"); }
function beginPlacing(mode){
  // snapshot the booking (all its split services) before closing the editor
  const snap={
    sheetKey:EDIT.sheetKey, url:EDIT.url, site:EDIT.site, release:EDIT.release||"",
    contact:EDIT.contact||"", phone:EDIT.phone||"", maps:EDIT.maps||"", driver:EDIT.driver||"", tag:EDIT.tag||"",
    services:EDIT.services.map(s=>({...s})), origIds:(EDIT.origIds||[]).slice()
  };
  PLACING={ mode, job:snap };
  closeEditor();
  showPlaceBanner(mode);
}
function showPlaceBanner(mode){
  let el=document.getElementById("placeBanner");
  if(!el){ el=document.createElement("div"); el.id="placeBanner"; el.className="place-banner"; document.body.appendChild(el); }
  el.innerHTML=`<span>${mode==="copy"?"📋 Click an empty slot to drop the copy":"↪ Click an empty slot to move it"}</span>
     <button onclick="cancelPlacing()">Cancel</button>`;
  el.style.display="flex";
}
function cancelPlacing(){ PLACING=null; const el=document.getElementById("placeBanner"); if(el) el.style.display="none"; }

function placeHere(date, min, grid){
  const p=PLACING; cancelPlacing();
  if(!p) return;
  const base=p.job;
  // first service goes to the clicked slot; extra split services keep their offset
  const anchor=base.services[0] ? parseTimeMin(base.services[0].time) : min;
  if(p.mode==="move"){
    // move every original row to the new slot (keep each service's offset from anchor)
    base.services.forEach(sv=>{
      const off=(parseTimeMin(sv.time)-anchor)||0;
      const j=STATE.jobs.find(x=>x.id===sv.id);
      if(j){ j.tipDate=date; j.tipMin=min+off; j.grid=grid; }
    });
    render(); toast("Moving…");
    const writes=base.services.map(sv=>{
      const off=(parseTimeMin(sv.time)-anchor)||0;
      return postAction(base.url,{action:"update",id:sv.id,fields:{
        tipDate:isoDate(date), tipTime:minToSheetTime(min+off), grid:String(grid) }});
    });
    Promise.all(writes).then(rs=>{ rs.every(r=>r&&r.ok)?toast("Rescheduled"):(toast("Didn't save — refreshing",true),loadAll()); })
      .catch(()=>{ toast("Move failed — refreshing",true); loadAll(); });
  }else{
    // COPY: create new rows at the clicked slot from the snapshot
    createBookingAt(base, date, min, grid);
  }
}

      </div>

let REPEAT_BASE=null;
function doRepeat(){
  const base=REPEAT_BASE; if(!base) return;
  const freq=document.getElementById("repFreq").value;
  const untilV=document.getElementById("repUntil").value;
  if(!untilV){ toast("Pick an end date", true); return; }
  const [uy,um,ud]=untilV.split("-").map(Number);
  const until=new Date(uy,um-1,ud); until.setHours(23,59,59,0);
  // build the list of dates AFTER the original (don't duplicate the original itself)
  const dates=[]; let d=new Date(base.date);
  const step=(freq==="wd")?1:(+freq);
  let guard=0;
  while(guard++<400){
    d=addDays(d, step);
    if(d>until) break;
    if(freq==="wd"){ const dow=d.getDay(); if(dow===0||dow===6) continue; }
    dates.push(new Date(d));
  }
  if(!dates.length){ toast("No dates in that range", true); return; }
  closeEditor();
  dates.forEach(dt=> createBookingAt(base, dt, base.min, base.grid));
  toast(`Created ${dates.length} repeat${dates.length>1?"s":""}`);
}

/* create one booking (possibly split) at a slot, from a snapshot of fields */
function createBookingAt(base, date, min, grid){
  const url=base.url, sheetKey=base.sheetKey;
  const dateISO=isoDate(date);
  const anchor=base.services[0] ? parseTimeMin(base.services[0].time) : min;
  const writes=[];
  base.services.forEach(sv=>{
    const off=(parseTimeMin(sv.time)-anchor)||0;
    const tmin=min+off;
    const tempId="tmp"+Math.random().toString(36).slice(2,9);
    STATE.jobs.push({ id:tempId, sheetKey, url, site:base.site, release:base.release,
      contact:base.contact, phone:base.phone, maps:base.maps, driver:base.driver, tag:base.tag||"",
      commodity:sv.commodity, grade:sv.grade, status:"", grid:(grid), duration:+sv.duration,
      apptStatus:sv.apptStatus||"Pencilled", tipDate:date, tipMin:tmin, arrived:false });
    const fields={ site:base.site, release:base.release, contact:base.contact, phone:base.phone,
      maps:base.maps, driver:base.driver, tag:base.tag||"", tipDate:dateISO, tipTime:minToSheetTime(tmin),
      grid:String(grid), duration:String(sv.duration), commodity:sv.commodity, grade:sv.grade,
      apptStatus:sv.apptStatus||"Pencilled", transporter:sheetKey };
    writes.push(postAction(url,{action:"create",fields}).then(r=>{
      if(r&&r.ok&&r.id){ const t=STATE.jobs.find(x=>x.id===tempId); if(t) t.id=r.id; } return r; }));
  });
  render(); toast("Copying…");
  Promise.all(writes).then(rs=>{ rs.every(r=>r&&r.ok)?toast("Duplicated"):(toast("Didn't save — refreshing",true),loadAll()); })
    .catch(()=>{ toast("Copy failed — refreshing",true); loadAll(); });
}

/* greedy interval-colouring: pack overlapping jobs into side-by-side columns */
function layoutOverlaps(jobs){
  const sorted=[...jobs].sort((a,b)=> (a.tipMin-b.tipMin) || ((a.duration||DEFAULT_DUR)-(b.duration||DEFAULT_DUR)));
  // build clusters of mutually-overlapping jobs so each cluster gets its own column count
  const items=sorted.map(j=>({job:j, start:j.tipMin, end:j.tipMin+(j.duration||DEFAULT_DUR), col:0}));
  let out=[], cluster=[], clusterEnd=-1;
  const flush=()=>{
    if(!cluster.length) return;
    // assign columns within this cluster
    const colsEnd=[]; // end time per column
    cluster.forEach(it=>{
      let placed=false;
      for(let c=0;c<colsEnd.length;c++){ if(it.start>=colsEnd[c]){ it.col=c; colsEnd[c]=it.end; placed=true; break; } }
      if(!placed){ it.col=colsEnd.length; colsEnd.push(it.end); }
    });
    const ncols=colsEnd.length;
    cluster.forEach(it=> out.push({job:it.job, col:it.col, cols:ncols}));
    cluster=[]; clusterEnd=-1;
  };
  items.forEach(it=>{
    if(cluster.length && it.start>=clusterEnd){ flush(); }
    cluster.push(it); clusterEnd=Math.max(clusterEnd, it.end);
  });
  flush();
  return out;
}

function eventHTML(j, gridNo, col, cols, fullWidth){
  const dur=j.duration||DEFAULT_DUR;
  const top=((j.tipMin-DAY_START*60)/60)*HOUR_PX;
  const h=Math.max(16,(dur/60)*HOUR_PX)-1;
  const cvar=commodityVar(j.commodity);
  // solid when Confirmed, striped (scheduled) when pencilled-in/blank
  const cancelled = /^cancel/i.test(j.apptStatus||"");
  const confirmed = /^conf/i.test(j.apptStatus||"") || j.arrived;
  const cls = (confirmed ? "arrived" : "sched") + (cancelled ? " cancelled" : "");
  const dark = isDarkColor(cvar) ? " darktext" : "";
  // Line 1 = Release/Farm #; Line 2 = Commodity — Grade; Line 3 = time (driver only in the badge)
  const line1 = j.release || j.site || "—";
  // show "Commodity — Grade" unless the grade is already contained in the commodity text
  let commGrade = (j.commodity||"").trim();
  const grade = (j.grade||"").trim();
  if(grade && !commGrade.toLowerCase().includes(grade.toLowerCase())){
    commGrade = (commGrade ? commGrade+" — " : "") + grade;
  }
  if(!commGrade) commGrade = grade;
  const driver = (j.driver||"").trim();
  const timeRange = `${minToLabel(j.tipMin)} – ${minToLabel(j.tipMin+dur)}`;
  const line3 = timeRange;
  const compact = h < 34 ? " compact" : "";
  // geometry: a single-grid view gives the block the FULL column width;
  // otherwise it sits in its grid half (0% or 50%)
  const gridBase = fullWidth ? 0 : (gridNo===2 ? 50 : 0);
  const gridSpan = fullWidth ? 100 : 50;
  // OVERLAP = a clash to sort out. Split side-by-side so NEITHER is hidden,
  // each in its own sub-column, with a clear gap + a clash outline.
  const clash = cols>1;
  const colW = gridSpan / cols;
  const left = gridBase + col*colW;
  // leave a small gap on the RIGHT of each block so they don't look crammed
  // (matches the breathing room the single-grid view has). Narrower for clash.
  const rightGap = clash ? 2 : 6;   // percent of the grid
  const width = colW - rightGap;
  const z = 2 + col;
  const meta = sheetMeta(j.sheetKey);
  // no ribbon for Growers own (OWN) — it's the default, so a tag is just noise
  const transBadge = (j.sheetKey==="OWN")
    ? ""
    : `<span class="ev-trans" style="background:${meta.color}" title="${esc(meta.name)}">${esc(meta.short)}</span>`;
  const driverBadge = driver ? `<span class="ev-driver">${esc(driver)}</span>` : "";
  const note=(j.note||"").trim();
  const flag = note ? `<span class="ev-flag" title="${esc(note)}">📩</span>` : "";
  // per-booking visible tag (e.g. "25t") — shows as a pill beside the name, this load only
  const tag=(j.tag||"").trim();
  const tagPill = tag ? `<span class="ev-tag" title="${esc(tag)}">${esc(tag)}</span>` : "";
  return `<div class="ev ${cls}${compact}${dark}${clash?' clash':''}" data-id="${j.id}" data-sheet="${j.sheetKey}"
       data-stack="${cols>1?1:0}" data-z="${z}"
       title="${esc(line1)}${tag?(' ['+esc(tag)+']'):''} — ${esc(commGrade)} · ${esc(meta.name)}${driver?(' · '+esc(driver)):''}${note?(' · 📝 '+esc(note)):''} · ${timeRange} · Grid ${gridNo}${clash?' · double booking':''}"
       style="top:${top}px;height:${h}px;left:calc(${left}% + 1px);width:calc(${width}% - 2px);z-index:${z};--evc:${cvar};--gb:${gridBase}%;--gs:${gridSpan}%">
    ${transBadge}
    ${flag}
    ${cancelled?`<span class="cxtag">CANCELLED</span>`:driverBadge}
    <div class="title">${esc(line1)}${tagPill}</div>
    <div class="sub">${esc(commGrade)}</div>
    <div class="tm">${line3}</div>
    <div class="resize-handle"></div>
  </div>`;
}
/* busy / blocked time band — grey hatch, spans its grid (or both) */
function busyHTML(j, gf){
  const dur=j.duration||60;
  const top=((j.tipMin-DAY_START*60)/60)*HOUR_PX;
  const h=Math.max(16,(dur/60)*HOUR_PX)-1;
  // in a single-grid view, a busy block fills the full column
  let left, width;
  if(gf && gf!==0){ left=0; width=100; }
  else { left = j.grid===3 ? 0 : (j.grid===2?50:0); width = j.grid===3 ? 100 : 50; }
  const label = (j.site||"NO TRUCKS");
  const compact = h<28 ? " compact" : "";
  return `<div class="ev busy${compact}" data-id="${j.id}" data-sheet="${j.sheetKey}" data-busy="1"
       title="Busy — ${esc(label)} · ${minToLabel(j.tipMin)}–${minToLabel(j.tipMin+dur)}"
       style="top:${top}px;height:${h}px;left:calc(${left}% + 1px);width:calc(${width}% - 2px)">
    <div class="title">${esc(label)}</div>

function esc(s){return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));}

/* ---------- drag to reschedule ---------- */
let drag=null, resize=null;
function attachDrag(){
  document.querySelectorAll(".ev").forEach(ev=>{
    ev.addEventListener("pointerdown", onDown);
  });
  document.querySelectorAll(".resize-handle").forEach(h=>{
    h.addEventListener("pointerdown", onResizeDown);
  });
}
function onResizeDown(e){
  e.stopPropagation();           // don't start a move-drag
  const ev=e.target.closest(".ev");
  ev.setPointerCapture(e.pointerId);
  const job=STATE.jobs.find(j=>j.id===ev.dataset.id);
  resize={ ev, job, startY:e.clientY, origH:parseFloat(ev.style.height), origDur:job.duration||DEFAULT_DUR };
  ev.classList.add("resizing");
  window.addEventListener("pointermove", onResizeMove);
  window.addEventListener("pointerup", onResizeUp);
}
function onResizeMove(e){
  if(!resize) return;
  const dy=e.clientY-resize.startY;
  let newH=Math.max(HOUR_PX*MIN_DUR/60, resize.origH+dy);
  resize.ev.style.height=newH+"px";
  // live-update the time range label
  let mins=Math.max(MIN_DUR, Math.round((newH/HOUR_PX*60)/SLOT_MIN)*SLOT_MIN);
  const tmEl=resize.ev.querySelector(".tm");
  if(tmEl) tmEl.textContent=`${minToLabel(resize.job.tipMin)} – ${minToLabel(resize.job.tipMin+mins)}`;
  resize.ev.classList.toggle("compact", newH<34);
}
async function onResizeUp(e){
  if(!resize) return;
  window.removeEventListener("pointermove", onResizeMove);
  window.removeEventListener("pointerup", onResizeUp);
  const ev=resize.ev, job=resize.job;
  ev.classList.remove("resizing");
  const newH=parseFloat(ev.style.height);
  let mins=Math.max(MIN_DUR, Math.min(MAX_DUR, Math.round((newH/HOUR_PX*60)/SLOT_MIN)*SLOT_MIN));
  if(mins===resize.origDur){ render(); resize=null; return; }
  const prev=job.duration;
  job.duration=mins;
  render();
  const ok=await writeBack(job, { id:job.id, duration:String(mins) });
  if(ok){ toast(`Length set to ${mins} min`); }
  else { job.duration=prev; render(); toast("Couldn't save length — reverted", true); }
  resize=null;
}
function onDown(e){
  const ev=e.currentTarget;
  ev.setPointerCapture(e.pointerId);
  const id=ev.dataset.id;
  const job=STATE.jobs.find(j=>j.id===id);
  // grab offset = where inside the block the pointer landed, so the block
  // doesn't jump to put its top under the cursor
  const r=ev.getBoundingClientRect();
  drag={ ev, job, startX:e.clientX, startY:e.clientY,
         grabDY:e.clientY-r.top,
         origTop:parseFloat(ev.style.top), origLeft:ev.style.left,
         moved:false, lastMin:null };
  ev.classList.add("dragging");
  ev.classList.remove("settling");
  window.addEventListener("pointermove", onMove);
  window.addEventListener("pointerup", onUp);
}
function onMove(e){
  if(!drag) return;
  const dx=e.clientX-drag.startX, dy=e.clientY-drag.startY;
  if(Math.abs(dx)>3||Math.abs(dy)>3) drag.moved=true;
  if(!drag.moved) return;

  // the block ignores pointer events while dragging, so elementFromPoint now
  // returns the day column UNDER the cursor (even a different day)
  const el=document.elementFromPoint(e.clientX,e.clientY);
  const col=(el&&el.closest)?el.closest(".daycol"):null;
  document.querySelectorAll(".daycol.drop-ok").forEach(c=>c.classList.remove("drop-ok"));
  if(col) col.classList.add("drop-ok");

  // the block visually follows the pointer freely (both axes) so it can cross days
  drag.ev.style.transform=`translate(${dx}px, ${dy}px)`;

  // compute the target slot/grid from whichever column is under the cursor
  const refCol = col || drag.ev.closest(".daycol");
  const rect=refCol.getBoundingClientRect();
  const yTop=e.clientY-drag.grabDY-rect.top;
  const dur=drag.job.duration||DEFAULT_DUR;
  let min=DAY_START*60 + Math.round((yTop/HOUR_PX)*60/SLOT_MIN)*SLOT_MIN;
  min=Math.max(DAY_START*60, Math.min(DAY_END*60-dur, min));
  const grid = STATE.gridFilter!==0 ? STATE.gridFilter : ((e.clientX-rect.left) > rect.width/2 ? 2 : 1);

  drag.lastMin=min; drag.lastGrid=grid; drag.lastCol=col;
  const tmEl=drag.ev.querySelector(".tm");
  if(tmEl) tmEl.textContent=`${minToLabel(min)} – ${minToLabel(min+dur)}`;
}
async function onUp(e){
  if(!drag) return;
  window.removeEventListener("pointermove", onMove);
  window.removeEventListener("pointerup", onUp);
  const ev=drag.ev, job=drag.job;
  ev.classList.remove("dragging");
  ev.style.transform="";
  document.querySelectorAll(".daycol.drop-ok").forEach(c=>c.classList.remove("drop-ok"));

  if(!drag.moved){ // a tap (no drag)
    const id=ev.dataset.id;
    let j=STATE.jobs.find(x=>x.id===id) || drag.job;
    drag=null;
    // clashing block: first tap peeks it to full width (read it), 2nd tap opens
    if(ev.dataset.stack==="1" && !ev.classList.contains("peek")){
      document.querySelectorAll(".ev.peek").forEach(e=>e.classList.remove("peek"));
      ev.classList.add("peek");
      return;
    }
    if(j){ if(j.isBusy) openBusy(j); else openEditor(j); }
    return;
  }

  // use the drop target we tracked live during the drag (matches the preview)
  const col = drag.lastCol || (function(){
    const el=document.elementFromPoint(e.clientX,e.clientY);
    return el&&el.closest?el.closest(".daycol"):null;
  })();
  if(!col){ render(); drag=null; return; }

  const dur=job.duration||DEFAULT_DUR;
  let min = (drag.lastMin!=null) ? drag.lastMin : (function(){
    const rect=col.getBoundingClientRect();
    const yTop=e.clientY-drag.grabDY-rect.top;
    let m=DAY_START*60 + Math.round((yTop/HOUR_PX)*60/SLOT_MIN)*SLOT_MIN;
    return Math.max(DAY_START*60, Math.min(DAY_END*60-dur, m));
  })();
  min=Math.max(DAY_START*60, Math.min(DAY_END*60-dur, min));
  const grid = drag.lastGrid || 1;
  const newDayKey=+col.dataset.daykey;
  const newDate=dateFromKey(newDayKey);

  const changed = (dayKey(job.tipDate)!==newDayKey) || (job.tipMin!==min) || (job.grid!==grid);
  if(!changed){ render(); drag=null; return; }

  // optimistic update
  const prev={tipDate:job.tipDate,tipMin:job.tipMin,grid:job.grid};
  job.tipDate=newDate; job.tipMin=min; job.grid=grid;
  render();

  // write back
  const payload={ id:job.id, grid:String(grid),
    tipDate:isoDate(newDate), tipTime:minToSheetTime(min) };
  const ok=await writeBack(job, payload);
  if(ok){
    toast(`Moved to ${WD[newDate.getDay()]} ${newDate.getDate()} ${MONTHS[newDate.getMonth()]} · ${minToLabel(min)} · Grid ${grid}`);
  }else{
    // revert
    job.tipDate=prev.tipDate; job.tipMin=prev.tipMin; job.grid=prev.grid;
    render();
    toast("Couldn't save — change reverted", true);
  }
  drag=null;
}
function dateFromKey(k){ const y=Math.floor(k/10000),m=Math.floor((k%10000)/100),d=k%100; return new Date(y,m,d); }
function isoDate(d){ return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0"); }

async function writeBack(job, payload){
  if(!job.url || job.url.startsWith("PASTE_")){
    return true; // demo mode — pretend success
  }
  try{
    const res=await fetch(job.url,{
      method:"POST",
      body:JSON.stringify(payload),
      headers:{"Content-Type":"text/plain;charset=utf-8"} // avoids CORS preflight to Apps Script
    });
    const data=await res.json();
    return !!data.ok;
  }catch(e){ return false; }
}

/* richer POST that returns the full response (for update/create/delete). */
async function postAction(url, body){
  if(!url || url.startsWith("PASTE_")){
    // demo mode — fake a success, inventing an id for create
    return { ok:true, id:(body.action==="create"? "demo"+Math.random().toString(36).slice(2,8): body.id), created:body.action==="create", deleted:body.action==="delete" };
  }
  try{
    const res=await fetch(url,{ method:"POST", body:JSON.stringify(body),
      headers:{"Content-Type":"text/plain;charset=utf-8"} });
    return await res.json();
  }catch(e){ return { ok:false, error:String(e) }; }
}
function sheetByKey(key){ return SHEETS.find(s=>s.key===key); }

function toast(msg, err){
  const t=document.getElementById("toast");
  t.textContent=msg; t.className="toast show"+(err?" err":"");
  clearTimeout(toast._t);
  toast._t=setTimeout(()=>{t.className="toast";},2600);
}

/* ================= EDIT POPUP ================= */
let EDIT=null; // { job, services:[{commodity,grade,grid,time,duration, _id?}], site, date, apptStatus }

function openEditor(job){
  loadCatalogue();
  // A true split load = same transporter + grower + tip DATE + tip TIME (one slot,
  // multiple commodities). Jobs at different times are separate appointments, so
  // they are NOT grouped. (Different loads for the same grower across the day stay apart.)
  const siblings = STATE.jobs.filter(j=>
    j.sheetKey===job.sheetKey && j.site===job.site &&
    job.tipDate && j.tipDate && dayKey(j.tipDate)===dayKey(job.tipDate) &&
    j.tipMin===job.tipMin
  );
  EDIT = {
    sheetKey: job.sheetKey,
    url: job.url,
    origSheetKey: job.sheetKey,   // remember where it lives, to detect a transporter change
    origUrl: job.url,
    origSite: job.site,           // remember the grower name, to propagate an edit to its other bookings
    site: job.site,
    release: job.release||"", contact: job.contact||"", phone: job.phone||"", maps: job.maps||"", driver: job.driver||"", note: job.note||"", tag: job.tag||"",
    date: job.tipDate,
    services: siblings.map(j=>({
      id:j.id, commodity:j.commodity||"", grade:j.grade||"",
      grid:j.grid||1, time:minToSheetTime(j.tipMin!=null?j.tipMin:DAY_START*60),
      duration:j.duration||DEFAULT_DUR, apptStatus:j.apptStatus||"Pencilled"
    })),
    origIds: siblings.map(j=>j.id),
  };
  // the tapped job first
  EDIT.services.sort((a,b)=> a.id===job.id?-1:b.id===job.id?1:0);
  renderEditor();
  document.getElementById("editBackdrop").style.display="flex";
}
function closeEditor(){ document.getElementById("editBackdrop").style.display="none"; EDIT=null; }

/* pick which transporter a new booking defaults to.
   If a transporter filter is active, use it; otherwise default to Growers own. */
const DEFAULT_TRANSPORTER = "OWN";
function pickWriteSheet(){
  let sheet;
  if(STATE.filter!=="__ALL__") sheet=sheetByKey(STATE.filter);
  if(!sheet) sheet=sheetByKey(DEFAULT_TRANSPORTER);
  if(!sheet){ const live=SHEETS.filter(s=>s.url && !s.url.startsWith("PASTE_")); sheet=live[0]||SHEETS[0]; }
  return sheet;
}

/* open the editor as a brand-new booking for a clicked slot */
function openNewBooking(date, min, grid){
  loadCatalogue();
  const sheet=pickWriteSheet();
  EDIT = {
    isNew:true,
    sheetKey: sheet.key, url: sheet.url,
    site:"", release:"", contact:"", phone:"", maps:"", driver:"", note:"", tag:"", date,
    services:[{ id:null, commodity:"", grade:"", grid, time:minToSheetTime(min),
                duration:DEFAULT_DUR, apptStatus:"Pencilled" }],
    origIds:[],

}

function switchToBusy(){

  EDIT.isBusy=true;
  EDIT.site = EDIT.site || "NO TRUCKS";

/* open an existing busy block for edit/remove */
function openBusy(job){
  EDIT = {
    isBusy:true, isNew:false,
    sheetKey: job.sheetKey, url: job.url,
    site: job.site||"NO TRUCKS", date: job.tipDate,
    services:[{ id:job.id, grid:(job.grid===3?'BOTH':job.grid||1),

                duration:job.duration||60 }],
    origIds:[job.id],
  };
  renderEditor();

function saveBusy(){
  const url=EDIT.url, sheetKey=EDIT.sheetKey;
  const site=document.getElementById("editSite").value.trim()||"NO TRUCKS";
  const dateISO=EDIT.date?isoDate(EDIT.date):"";
  const tipDate=EDIT.date;
  const sv=EDIT.services[0];
  const tmin=parseTimeMin(sv.time);
  const gridVal = sv.grid; // "1","2","BOTH" / 1,2
  const gridNum = gridVal==='BOTH'||gridVal==='3'||gridVal===3 ? 3 : (+gridVal||1);
  const gridStore = gridVal==='BOTH' ? "BOTH" : String(gridNum);

  // optimistic
  if(sv.id){
    const j=STATE.jobs.find(x=>x.id===sv.id);
    if(j){ j.site=site; j.tipDate=tipDate; j.tipMin=tmin; j.grid=gridNum; j.duration=+sv.duration; }
  }else{
    sv._tempId="tmp"+Math.random().toString(36).slice(2,9);
    STATE.jobs.push({ id:sv._tempId, sheetKey, url, site, commodity:"BUSY", release:"", status:"",
      driver:"", grade:"", grid:gridNum, duration:+sv.duration, apptStatus:"", isBusy:true,
      tipDate, tipMin:tmin, arrived:false });
  }
  closeEditor(); render(); toast("Saving…");

  const fields={ site, commodity:"BUSY", tipDate:dateISO, tipTime:sv.time,
                 grid:gridStore, duration:String(sv.duration), apptStatus:"", transporter:sheetKey };
  const p = sv.id ? postAction(url,{action:"update",id:sv.id,fields})
                  : postAction(url,{action:"create",fields}).then(r=>{
                      if(r&&r.ok&&r.id){ const t=STATE.jobs.find(x=>x.id===sv._tempId); if(t) t.id=r.id; }
                      return r; });
  p.then(r=>{ if(r&&r.ok){toast("Busy time saved");} else {toast("Didn't save — refreshing",true);loadAll();} })
   .catch(()=>{ toast("Save failed — refreshing",true); loadAll(); });
}

function deleteBusy(){
  if(!confirm("Remove this busy time?")) return;
  const url=EDIT.url, id=EDIT.origIds[0];
  STATE.jobs=STATE.jobs.filter(j=>j.id!==id);
  closeEditor(); render(); toast("Removing…");
  postAction(url,{action:"delete",id}).then(r=>{
    if(r&&r.ok){toast("Busy time removed");} else {toast("Didn't remove — refreshing",true);loadAll();}
  }).catch(()=>{ toast("Remove failed — refreshing",true); loadAll(); });
}

        !_editedSet.has(j.id) && !/^tmp/.test(j.id||"") &&

                       : (isNew ? "New booking" : "Edit appointment");

  const pickerHTML = `
      <div class="m-field">

        <select class="lineinput" id="editSheet" onchange="onSheetChange(this.value)">
          ${SHEETS.map(s=>{
            const liveTag = (s.url && !s.url.startsWith("PASTE_")) ? "" : " (not synced yet)";
            return `<option value="${s.key}" ${s.key===EDIT.sheetKey?"selected":""}>${esc(s.name)}${liveTag}</option>`;
          }).join("")}
        </select>
      </div>`;

  // ---- BUSY-TIME editor: just date, grid, time, duration, label ----
  if(isBusy){
    const sv = EDIT.services[0];
    const durOpts = [15,30,45,60,90,120,180,240,360,480].map(m=>
      `<option value="${m}" ${(+sv.duration===m)?"selected":""}>${m} min</option>`).join("");
    const busyHTML=`
      <div class="m-head">

      </div>

        </div>

/* pull whatever the user has typed/picked in the open modal back into EDIT,
   so a re-render (commodity change, add service, date pick…) never wipes it */
// when a FARM / RELEASE is typed or chosen, prefill the grower + stored details
function onFarmType(farm){
  EDIT.release=farm;
  const g=growerByFarm(farm);
  if(!g) return;
  // fill the grower name + blanks from the directory (don't overwrite what's typed)
  if(g.site){ EDIT.site=g.site; const se=document.getElementById("editSite"); if(se) se.value=g.site; }
  if(!EDIT.contact && g.contact){ EDIT.contact=g.contact; const ce=document.getElementById("editContact"); if(ce) ce.value=g.contact; }
  if(!EDIT.phone && g.phone){ EDIT.phone=g.phone; const pe=document.getElementById("editPhone"); if(pe) pe.value=g.phone; }
  if(!EDIT.maps && g.maps) EDIT.maps=g.maps;
  if(!EDIT.driver && g.driver) EDIT.driver=g.driver;
  // default commodity on the first service if it's still blank
  if(g.commodity && EDIT.services[0] && !EDIT.services[0].commodity){
    EDIT.services[0].commodity=g.commodity;
    EDIT.services[0].grade=g.grade||"";
    renderEditor();   // refresh the commodity select + swatch
    const re=document.getElementById("editRelease"); if(re){ re.value=farm; re.focus(); }
  }
}
function onSheetChange(key){
  const s=sheetByKey(key); if(!s) return;
  EDIT.sheetKey=s.key; EDIT.url=s.url;
  const chip=document.getElementById("editSheetChip");
  const m=sheetMeta(key);
  if(chip){ chip.style.background=m.color; chip.textContent=m.short; }
}
function syncEditFields(){
  if(!EDIT) return;
  const siteEl=document.getElementById("editSite");
  if(siteEl) EDIT.site=siteEl.value;
  const relEl=document.getElementById("editRelease");
  if(relEl) EDIT.release=relEl.value;
  const noteEl=document.getElementById("editNote");
  if(noteEl) EDIT.note=noteEl.value;
  const tagEl=document.getElementById("editTag");
  if(tagEl) EDIT.tag=tagEl.value;
  const contactEl=document.getElementById("editContact");
  if(contactEl) EDIT.contact=contactEl.value;
  const phoneEl=document.getElementById("editPhone");
  if(phoneEl) EDIT.phone=phoneEl.value;
  const sheetEl=document.getElementById("editSheet");
  if(sheetEl && sheetEl.tagName==="SELECT"){ const s=sheetByKey(sheetEl.value); if(s){ EDIT.sheetKey=s.key; EDIT.url=s.url; } }
  // per-service live inputs (time field + the selects' current values)
  document.querySelectorAll(".service").forEach((el)=>{
    const idx=+el.dataset.idx;
    const sv = (idx>=0 && EDIT.services[idx]) ? EDIT.services[idx] : EDIT.services[0];
    if(!sv) return;
    const t=el.querySelector(".time-in"); if(t) sv.time=t.value;
    const g=el.querySelector(".grid-sel"); if(g) sv.grid = (g.value==="BOTH"?"BOTH":+g.value);
    const d=el.querySelector(".dur-sel"); if(d) sv.duration=+d.value;
  });
}

function onCommodityChange(idx, sel){
  syncEditFields();
  if(sel.value==="__ADD__"){
    openAddCommodity(idx);           // name + colour picker popup
    return;
  }
  const o=commodityOptions().find(x=>x.label===sel.value);
  if(o){ EDIT.services[idx].commodity=o.commodity; EDIT.services[idx].grade=o.grade; }
  renderEditor(); // refresh swatch colour
}

function saveNewCommodity(){
