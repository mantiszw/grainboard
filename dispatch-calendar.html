function onResizeDown(e){
  e.stopPropagation();           // don't start a move-drag
  const ev=e.target.closest(".ev");
  ev.setPointerCapture(e.pointerId);
  const job=STATE.jobs.find(j=>j.id===ev.dataset.id);
  resize={ ev, job, startY:e.clientY, origH:parseFloat(ev.style.height), origDur:job.duration||DEFAULT_DUR };
  ev.classList.add("resizing");
  window.addEventListener("pointermove", onResizeMove);
  window.addEventListener("pointerup", onResizeUp);
}
function onResizeMove(e){
  if(!resize) return;
  const dy=e.clientY-resize.startY;
  let newH=Math.max(HOUR_PX*MIN_DUR/60, resize.origH+dy);
  resize.ev.style.height=newH+"px";
  // live-update the time range label
  let mins=Math.max(MIN_DUR, Math.round((newH/HOUR_PX*60)/SLOT_MIN)*SLOT_MIN);
  const tmEl=resize.ev.querySelector(".tm");
  if(tmEl) tmEl.textContent=`${minToLabel(resize.job.tipMin)} – ${minToLabel(resize.job.tipMin+mins)}`;
  resize.ev.classList.toggle("compact", newH<34);
}
async function onResizeUp(e){
  if(!resize) return;
  window.removeEventListener("pointermove", onResizeMove);
  window.removeEventListener("pointerup", onResizeUp);
  const ev=resize.ev, job=resize.job;
  ev.classList.remove("resizing");
  const newH=parseFloat(ev.style.height);
  let mins=Math.max(MIN_DUR, Math.min(MAX_DUR, Math.round((newH/HOUR_PX*60)/SLOT_MIN)*SLOT_MIN));
  if(mins===resize.origDur){ render(); resize=null; return; }
  const prev=job.duration;
  job.duration=mins;
  render();
  const ok=await writeBack(job, { id:job.id, duration:String(mins) });
  if(ok){ toast(`Length set to ${mins} min`); }
  else { job.duration=prev; render(); toast("Couldn't save length — reverted", true); }
  resize=null;
}
function onDown(e){
  const ev=e.currentTarget;
  const id=ev.dataset.id;
  // Ctrl / Cmd / Shift-click → toggle this block in the multi-selection
  // (no drag, no editor — just add/remove it).
  if(e.ctrlKey||e.metaKey||e.shiftKey){
    e.preventDefault(); e.stopPropagation();
    toggleSelect(ev);
    const killer=(ce)=>{ ce.stopPropagation(); ce.preventDefault(); window.removeEventListener("click",killer,true); };
    window.addEventListener("click",killer,true);
    setTimeout(()=>window.removeEventListener("click",killer,true),400);
    return;
  }
  // If this block is part of a multi-selection, drag the whole GROUP together.
  if(SELECTED.size>=1 && SELECTED.has(id)){
    return groupDown(e, ev);
  }
  // A plain click/drag on an unselected block clears any selection first.
  if(SELECTED.size){ clearSelection(); }
  ev.setPointerCapture(e.pointerId);
  const job=STATE.jobs.find(j=>j.id===id);
  // grab offset = where inside the block the pointer landed, so the block
  // doesn't jump to put its top under the cursor
  const r=ev.getBoundingClientRect();
  drag={ ev, job, startX:e.clientX, startY:e.clientY,
         grabDY:e.clientY-r.top,
         origTop:parseFloat(ev.style.top), origLeft:ev.style.left,
         moved:false, lastMin:null };
  ev.classList.add("dragging");
  ev.classList.remove("settling");
  window.addEventListener("pointermove", onMove);
  window.addEventListener("pointerup", onUp);
}

/* ---- group move: drag the whole selection by one day/time offset ---- */
function groupDown(e, ev){
  const items=[...SELECTED].map(id=>{
    const el=document.querySelector(`.ev[data-id="${id}"]`);
    const job=STATE.jobs.find(j=>j.id===id);
    return (el&&job)?{el,job,origTop:parseFloat(el.style.top)}:null;
  }).filter(Boolean);
  if(!items.length) return;
  groupDrag={ startX:e.clientX, startY:e.clientY, moved:false, items,
              anchorJob: items.find(i=>i.job.id===ev.dataset.id).job };
  items.forEach(i=>i.el.classList.add("dragging"));
  window.addEventListener("pointermove", onGroupMove);
  window.addEventListener("pointerup", onGroupUp);
}
function onGroupMove(e){
  if(!groupDrag) return;
  const dx=e.clientX-groupDrag.startX, dy=e.clientY-groupDrag.startY;
  if(Math.abs(dx)>3||Math.abs(dy)>3) groupDrag.moved=true;
  if(!groupDrag.moved) return;
  // every selected block follows the pointer by the same visual delta
  groupDrag.items.forEach(i=>{ i.el.style.transform=`translate(${dx}px, ${dy}px)`; });
  // which day column is under the cursor → target for the ANCHOR block
  const el=document.elementFromPoint(e.clientX,e.clientY);
  const col=(el&&el.closest)?el.closest(".daycol"):null;
  document.querySelectorAll(".daycol.drop-ok").forEach(c=>c.classList.remove("drop-ok"));
  if(col) col.classList.add("drop-ok");
  groupDrag.lastCol=col;
  groupDrag.lastDX=dx; groupDrag.lastDY=dy;
}
async function onGroupUp(e){
  window.removeEventListener("pointermove", onGroupMove);
  window.removeEventListener("pointerup", onGroupUp);
  if(!groupDrag){ return; }
  const g=groupDrag; groupDrag=null;
  document.querySelectorAll(".daycol.drop-ok").forEach(c=>c.classList.remove("drop-ok"));
  g.items.forEach(i=>{ i.el.classList.remove("dragging"); i.el.style.transform=""; });

  if(!g.moved){ // a plain click on a selected block → just open it
    const j=g.anchorJob; if(j){ if(j.isBusy) openBusy(j); else openEditor(j); }
    return;
  }

  // work out the offset from the ANCHOR block's old slot to where it was dropped
  const col=g.lastCol;
  if(!col){ render(); return; }
  const newDayKey=+col.dataset.daykey;
  const anchorOldDayKey=dayKey(g.anchorJob.tipDate);
  const dayDelta=daysBetweenKeys(anchorOldDayKey, newDayKey);
  // time delta from the vertical drag (snapped to slots)
  const minDelta=Math.round((g.lastDY/HOUR_PX*60)/SLOT_MIN)*SLOT_MIN;

  if(dayDelta===0 && minDelta===0){ render(); return; }

  // apply the SAME offset to every selected block, clamped to day bounds
  const prev=g.items.map(i=>({job:i.job, tipDate:i.job.tipDate, tipMin:i.job.tipMin}));
  g.items.forEach(({job})=>{
    const dur=job.duration||DEFAULT_DUR;
    const nd=addDays(job.tipDate, dayDelta);
    let nm=job.tipMin+minDelta;
    nm=Math.max(DAY_START*60, Math.min(DAY_END*60-dur, nm));
    job.tipDate=nd; job.tipMin=nm;
  });
  render();
  toast(`Moving ${g.items.length} bookings…`);

  // write each one back (parallel); revert ALL if any fails
  const writes=g.items.map(({job})=>writeBack(job,{ id:job.id, grid:String(job.grid||1),
    tipDate:isoDate(job.tipDate), tipTime:minToSheetTime(job.tipMin) }));
  const results=await Promise.all(writes);
  if(results.every(Boolean)){
    toast(`Moved ${g.items.length} bookings`);
  }else{
    prev.forEach(p=>{ p.job.tipDate=p.tipDate; p.job.tipMin=p.tipMin; });
    render();
    const n=results.filter(x=>!x).length;
    toast(`${n} of ${g.items.length} didn't save — all reverted`, true);
  }
}
function onMove(e){
  if(!drag) return;
  const dx=e.clientX-drag.startX, dy=e.clientY-drag.startY;
  if(Math.abs(dx)>3||Math.abs(dy)>3) drag.moved=true;
  if(!drag.moved) return;

  // the block ignores pointer events while dragging, so elementFromPoint now
  // returns the day column UNDER the cursor (even a different day)
  const el=document.elementFromPoint(e.clientX,e.clientY);
  const col=(el&&el.closest)?el.closest(".daycol"):null;
  document.querySelectorAll(".daycol.drop-ok").forEach(c=>c.classList.remove("drop-ok"));
  if(col) col.classList.add("drop-ok");

  // the block visually follows the pointer freely (both axes) so it can cross days
  drag.ev.style.transform=`translate(${dx}px, ${dy}px)`;

  // compute the target slot/grid from whichever column is under the cursor
  const refCol = col || drag.ev.closest(".daycol");
  const rect=refCol.getBoundingClientRect();
  const yTop=e.clientY-drag.grabDY-rect.top;
  const dur=drag.job.duration||DEFAULT_DUR;
  let min=DAY_START*60 + Math.round((yTop/HOUR_PX)*60/SLOT_MIN)*SLOT_MIN;
  min=Math.max(DAY_START*60, Math.min(DAY_END*60-dur, min));
  const grid = STATE.gridFilter!==0 ? STATE.gridFilter : ((e.clientX-rect.left) > rect.width/2 ? 2 : 1);

  drag.lastMin=min; drag.lastGrid=grid; drag.lastCol=col;
  const tmEl=drag.ev.querySelector(".tm");
  if(tmEl) tmEl.textContent=`${minToLabel(min)} – ${minToLabel(min+dur)}`;
}
async function onUp(e){
  if(!drag) return;
  window.removeEventListener("pointermove", onMove);
  window.removeEventListener("pointerup", onUp);
  const ev=drag.ev, job=drag.job;
  ev.classList.remove("dragging");
  ev.style.transform="";
  document.querySelectorAll(".daycol.drop-ok").forEach(c=>c.classList.remove("drop-ok"));

  if(!drag.moved){ // a tap (no drag)
    const id=ev.dataset.id;
    let j=STATE.jobs.find(x=>x.id===id) || drag.job;
    drag=null;
    // clashing block: first tap peeks it to full width (read it), 2nd tap opens
    if(ev.dataset.stack==="1" && !ev.classList.contains("peek")){
      document.querySelectorAll(".ev.peek").forEach(e=>e.classList.remove("peek"));
      ev.classList.add("peek");
      return;
    }
    if(j){ if(j.isBusy) openBusy(j); else openEditor(j); }
    return;
  }

  // use the drop target we tracked live during the drag (matches the preview)
  const col = drag.lastCol || (function(){
    const el=document.elementFromPoint(e.clientX,e.clientY);
    return el&&el.closest?el.closest(".daycol"):null;
  })();
  if(!col){ render(); drag=null; return; }

  const dur=job.duration||DEFAULT_DUR;
  let min = (drag.lastMin!=null) ? drag.lastMin : (function(){
    const rect=col.getBoundingClientRect();
    const yTop=e.clientY-drag.grabDY-rect.top;
    let m=DAY_START*60 + Math.round((yTop/HOUR_PX)*60/SLOT_MIN)*SLOT_MIN;
    return Math.max(DAY_START*60, Math.min(DAY_END*60-dur, m));
  })();
  min=Math.max(DAY_START*60, Math.min(DAY_END*60-dur, min));
  const grid = drag.lastGrid || 1;
  const newDayKey=+col.dataset.daykey;
  const newDate=dateFromKey(newDayKey);

  const changed = (dayKey(job.tipDate)!==newDayKey) || (job.tipMin!==min) || (job.grid!==grid);
  if(!changed){ render(); drag=null; return; }

  // optimistic update
  const prev={tipDate:job.tipDate,tipMin:job.tipMin,grid:job.grid};
  job.tipDate=newDate; job.tipMin=min; job.grid=grid;
  render();

  // write back
  const payload={ id:job.id, grid:String(grid),
    tipDate:isoDate(newDate), tipTime:minToSheetTime(min) };
  const ok=await writeBack(job, payload);
  if(ok){
    toast(`Moved to ${WD[newDate.getDay()]} ${newDate.getDate()} ${MONTHS[newDate.getMonth()]} · ${minToLabel(min)} · Grid ${grid}`);
  }else{
    // revert
    job.tipDate=prev.tipDate; job.tipMin=prev.tipMin; job.grid=prev.grid;
    render();
    toast("Couldn't save — change reverted", true);
  }
  drag=null;
}
function dateFromKey(k){ const y=Math.floor(k/10000),m=Math.floor((k%10000)/100),d=k%100; return new Date(y,m,d); }
function daysBetweenKeys(a,b){ return Math.round((dateFromKey(b)-dateFromKey(a))/86400000); }
function isoDate(d){ return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0"); }

let PENDING_WRITES=0;   // in-flight sheet writes; auto-refresh waits for these
async function writeBack(job, payload){
  if(!job.url || job.url.startsWith("PASTE_")){
    return true; // demo mode — pretend success
  }
  // one write, with a generous timeout; retried once on failure, because
  // Apps Script can be slow/flaky — a single hiccup shouldn't revert the move.
  async function attempt(){
    const ctrl=new AbortController();
    const to=setTimeout(()=>ctrl.abort(), 25000);   // 25s ceiling per try
    try{
      const res=await fetch(job.url,{
        method:"POST",
        body:JSON.stringify({action:"update", ...payload}),
        headers:{"Content-Type":"text/plain;charset=utf-8"}, // avoids CORS preflight
        redirect:"follow",
        signal:ctrl.signal
      });
      const data=await res.json();
      return !!data.ok;
    }catch(e){ console.warn("[dispatch] writeBack fail:", e); return false; }
    finally{ clearTimeout(to); }
  }
  PENDING_WRITES++;
  try{
    if(await attempt()) return true;
    return await attempt();   // one retry
  }finally{ PENDING_WRITES=Math.max(0,PENDING_WRITES-1); }
}

/* richer POST that returns the full response (for update/create/delete). */
async function postAction(url, body){
  if(!url || url.startsWith("PASTE_")){
    // demo mode — fake a success, inventing an id for create
    return { ok:true, id:(body.action==="create"? "demo"+Math.random().toString(36).slice(2,8): body.id), created:body.action==="create", deleted:body.action==="delete" };
  }
  PENDING_WRITES++;
  const ctrl=new AbortController();
  const to=setTimeout(()=>ctrl.abort(), 25000);
  try{
    const res=await fetch(url,{ method:"POST", body:JSON.stringify(body),
      headers:{"Content-Type":"text/plain;charset=utf-8"}, redirect:"follow", signal:ctrl.signal });
    return await res.json();
  }catch(e){ return { ok:false, error:String(e) }; }
  finally{ clearTimeout(to); PENDING_WRITES=Math.max(0,PENDING_WRITES-1); }
}
function sheetByKey(key){ return SHEETS.find(s=>s.key===key); }

function toast(msg, err){
  const t=document.getElementById("toast");
  t.textContent=msg; t.className="toast show"+(err?" err":"");
  clearTimeout(toast._t);
  toast._t=setTimeout(()=>{t.className="toast";},2600);
}

/* ================= EDIT POPUP ================= */
let EDIT=null; // { job, services:[{commodity,grade,grid,time,duration, _id?}], site, date, apptStatus }

function openEditor(job){
  loadCatalogue();
  // A true split load = same transporter + grower + tip DATE + tip TIME (one slot,
  // multiple commodities). Jobs at different times are separate appointments, so
  // they are NOT grouped. (Different loads for the same grower across the day stay apart.)
  const siblings = STATE.jobs.filter(j=>
    j.sheetKey===job.sheetKey && j.site===job.site &&
    job.tipDate && j.tipDate && dayKey(j.tipDate)===dayKey(job.tipDate) &&
    j.tipMin===job.tipMin
  );
  EDIT = {
    sheetKey: job.sheetKey,
    url: job.url,
    origSheetKey: job.sheetKey,   // remember where it lives, to detect a transporter change
    origUrl: job.url,
    origSite: job.site,           // remember the grower name, to propagate an edit to its other bookings
    site: job.site,
    release: job.release||"", contact: job.contact||"", phone: job.phone||"", maps: job.maps||"", driver: job.driver||"", note: job.note||"", notes: job.notes||"", tag: job.tag||"",
    date: job.tipDate,
    services: siblings.map(j=>({
      id:j.id, commodity:j.commodity||"", grade:j.grade||"",
      grid:j.grid||1, time:minToSheetTime(j.tipMin!=null?j.tipMin:DAY_START*60),
      duration:j.duration||DEFAULT_DUR, apptStatus:j.apptStatus||"Pencilled"
    })),
    origIds: siblings.map(j=>j.id),
  };
  // the tapped job first
  EDIT.services.sort((a,b)=> a.id===job.id?-1:b.id===job.id?1:0);
  renderEditor();
  document.getElementById("editBackdrop").style.display="flex";
}
function closeEditor(){ document.getElementById("editBackdrop").style.display="none"; EDIT=null; }

/* pick which transporter a new booking defaults to.
   If a transporter filter is active, use it; otherwise default to Growers own. */
const DEFAULT_TRANSPORTER = "OWN";
function pickWriteSheet(){
  let sheet;
  if(STATE.filter!=="__ALL__") sheet=sheetByKey(STATE.filter);
  if(!sheet) sheet=sheetByKey(DEFAULT_TRANSPORTER);
  if(!sheet){ const live=SHEETS.filter(s=>s.url && !s.url.startsWith("PASTE_")); sheet=live[0]||SHEETS[0]; }
  return sheet;
}

function saveBusy(){
  const url=EDIT.url, sheetKey=EDIT.sheetKey;
  const site=document.getElementById("editSite").value.trim()||"NO TRUCKS";
  const dateISO=EDIT.date?isoDate(EDIT.date):"";
  const tipDate=EDIT.date;
  const sv=EDIT.services[0];
  const tmin=parseTimeMin(sv.time);
  const gridVal = sv.grid; // "1","2","BOTH" / 1,2
  const gridNum = gridVal==='BOTH'||gridVal==='3'||gridVal===3 ? 3 : (+gridVal||1);
  const gridStore = gridVal==='BOTH' ? "BOTH" : String(gridNum);

  // optimistic
  if(sv.id){
    const j=STATE.jobs.find(x=>x.id===sv.id);
    if(j){ j.site=site; j.tipDate=tipDate; j.tipMin=tmin; j.grid=gridNum; j.duration=+sv.duration; }
  }else{
    sv._tempId="tmp"+Math.random().toString(36).slice(2,9);
    STATE.jobs.push({ id:sv._tempId, sheetKey, url, site, commodity:"BUSY", release:"", status:"",
      driver:"", grade:"", grid:gridNum, duration:+sv.duration, apptStatus:"", isBusy:true,
      tipDate, tipMin:tmin, arrived:false });
  }
  closeEditor(); render(); toast("Saving…");

  const fields={ site, commodity:"BUSY", tipDate:dateISO, tipTime:sv.time,
                 grid:gridStore, duration:String(sv.duration), apptStatus:"", transporter:sheetKey };
  const p = sv.id ? postAction(url,{action:"update",id:sv.id,fields})
                  : postAction(url,{action:"create",fields}).then(r=>{
                      if(r&&r.ok&&r.id){ const t=STATE.jobs.find(x=>x.id===sv._tempId); if(t) t.id=r.id; }
                      return r; });
  p.then(r=>{ if(r&&r.ok){toast("Busy time saved");} else {toast("Didn't save — refreshing",true);loadAll();} })
   .catch(()=>{ toast("Save failed — refreshing",true); loadAll(); });
}

function deleteBusy(){
  if(!confirm("Remove this busy time?")) return;
  const url=EDIT.url, id=EDIT.origIds[0];
  STATE.jobs=STATE.jobs.filter(j=>j.id!==id);
  closeEditor(); render(); toast("Removing…");
  postAction(url,{action:"delete",id}).then(r=>{
    if(r&&r.ok){toast("Busy time removed");} else {toast("Didn't remove — refreshing",true);loadAll();}
  }).catch(()=>{ toast("Remove failed — refreshing",true); loadAll(); });
}

function onFarmType(farm){

  if(g.site){ EDIT.site=g.site; const se=document.getElementById("editSite"); if(se) se.value=g.site; }

  if(!EDIT.phone && g.phone){ EDIT.phone=g.phone; const pe=document.getElementById("editPhone"); if(pe) pe.value=g.phone; }
  if(!EDIT.maps && g.maps) EDIT.maps=g.maps;

  if(g.commodity && EDIT.services[0] && !EDIT.services[0].commodity){

/* resolve a CSS value like "var(--c-oats)" or "#aabbcc" to a concrete #hex
   (needed to prefill the native colour input) */
function resolveHex(cssVal){
  if(!cssVal) return "#cccccc";
  if(/^#[0-9a-f]{6}$/i.test(cssVal)) return cssVal;
  try{
    const probe=document.createElement("span");
    probe.style.color=cssVal; document.body.appendChild(probe);
    const rgb=getComputedStyle(probe).color; probe.remove();
    const m=rgb.match(/(\d+),\s*(\d+),\s*(\d+)/);
    if(m){ const h=(n)=>(+n).toString(16).padStart(2,"0"); return "#"+h(m[1])+h(m[2])+h(m[3]); }
  }catch(e){}
  return "#cccccc";
}

  const url=EDIT.url, sheetKey=EDIT.sheetKey;
  const site=document.getElementById("editSite").value.trim();

  const maps=(EDIT.maps||"").trim();

  const tag=(EDIT.tag||"").trim();
  const dateISO = EDIT.date ? isoDate(EDIT.date) : "";
  const tipDate = EDIT.date;
  const services=EDIT.services.map(s=>({...s}));
  const toDelete=(EDIT._toDelete||[]).slice();
  // capture propagation inputs NOW — closeEditor() below nulls EDIT
  const propIsNew   = !!EDIT.isNew;
  const propOrigName= (EDIT.origSite||"").trim().toLowerCase();
  const propEditedIds = new Set(EDIT.origIds||[]);
  // propagate to this grower's OTHER bookings ONLY if the user ticked the box
  // (default OFF — editing one booking must not silently rewrite the rest)
  const applyAllEl = document.getElementById("applyAllGrower");
  const propApplyAll = !!(applyAllEl && applyAllEl.checked);

  // ---- OPTIMISTIC: update local state + UI immediately, write in background ----
  // 1. apply deletes locally
  toDelete.forEach(id=>{ STATE.jobs=STATE.jobs.filter(j=>j.id!==id); });
  // 2. apply updates/creates locally
  services.forEach(sv=>{
    const tmin=parseTimeMin(sv.time);
    if(sv.id){
      const j=STATE.jobs.find(x=>x.id===sv.id);
      if(j){ j.site=site; j.release=release; j.contact=contact; j.phone=phone; j.maps=maps; j.driver=driver; j.note=note; j.notes=notes; j.tag=tag;
             j.tipDate=tipDate; j.tipMin=tmin; j.grid=+sv.grid;
             j.duration=+sv.duration; j.commodity=sv.commodity; j.grade=sv.grade; j.apptStatus=sv.apptStatus; }
    }else{
      // temporary local job until the sheet gives it a real id
      sv._tempId="tmp"+Math.random().toString(36).slice(2,9);
      STATE.jobs.push({ id:sv._tempId, sheetKey, url, site, commodity:sv.commodity, grade:sv.grade,
        release, contact, phone, maps, status:"", driver, note, notes, tag, grid:+sv.grid, duration:+sv.duration,
        apptStatus:sv.apptStatus, tipDate, tipMin:tmin, arrived:false });
    }
  });
  closeEditor();
  render();
  toast("Saving…");

  // ---- background writes, all in PARALLEL ----
  const jobs=[];
  toDelete.forEach(id=> jobs.push(postAction(url,{action:"delete",id})));
  services.forEach(sv=>{
    // NOTE: we deliberately do NOT write `note` — that's Marleys' column, owned
    // by them in the sheet. The board only writes `notes` (our team note).
    const fields={ site, release, contact, phone, maps, driver, notes, tag, tipDate:dateISO, tipTime:sv.time, grid:String(sv.grid),
      duration:String(sv.duration), commodity:sv.commodity, grade:sv.grade, apptStatus:sv.apptStatus,
      transporter:sheetKey };   // tag the booking type (for shared "Other" sheet)
    if(sv.id){ jobs.push(postAction(url,{action:"update",id:sv.id,fields})); }
    else{ jobs.push(postAction(url,{action:"create",fields}).then(r=>{
            // swap the temp id for the real one the sheet assigned
            if(r&&r.ok&&r.id){ const t=STATE.jobs.find(x=>x.id===sv._tempId); if(t) t.id=r.id; }
            return r;
          })); }
  });
  // remember this grower in the directory (accumulates every new grower)
  if(site){
    saveGrower(url, { site, release, contact, phone, maps, driver,
      commodity:(services[0]&&services[0].commodity)||"", grade:(services[0]&&services[0].grade)||"" });
  }
  // ---- propagate the grower edit to this grower's OTHER bookings ----
  // ONLY when the user ticked "apply to all bookings for this grower". By
  // default a save changes just THIS booking. Matches by the ORIGINAL grower
  // name (exact, case-insensitive).
  if(!propIsNew && propApplyAll){
    const origName=propOrigName;
    const editedIds=propEditedIds;
    if(origName){
      STATE.jobs.forEach(j=>{
        if(editedIds.has(j.id)) return;                 // skip the ones we just edited
        if((j.site||"").trim().toLowerCase()!==origName) return;
        if(/^tmp/.test(j.id||"")) return;               // skip not-yet-saved
        // update the grower-level details on this other booking.
        // NOTE: driver is per-LOAD (different trucks), so it is NOT propagated.
        j.site=site; j.release=release; j.contact=contact; j.phone=phone; j.maps=maps;
        const f={ site, release, contact, phone, maps };
        jobs.push(postAction(j.url,{action:"update",id:j.id,fields:f}));
      });
    }
  }
  Promise.all(jobs).then(results=>{
    const ok=results.every(r=>r&&r.ok);
    if(ok){ toast("Saved"); }
    else{
      const bad=results.find(r=>!(r&&r.ok));
      const msg=(bad&&bad.error)?String(bad.error).slice(0,70):"check the sheet script";
      console.error("[dispatch] save failed:", results);
      toast("Didn't save — "+msg, true);
      loadAll();
    }
  }).catch(e=>{ console.error(e); toast("Save failed — "+String(e&&e.message||e).slice(0,60), true); loadAll(); });
}

/* move an existing load to a different transporter sheet:
   delete the old rows from the old sheet, create them on the new sheet */
function moveToTransporter(){
  syncEditFields();
  const newUrl=EDIT.url, newKey=EDIT.sheetKey;
  const oldUrl=EDIT.origUrl;
  const site=(document.getElementById("editSite")||{}).value?.trim?.() || EDIT.site || "";
  const relEl=document.getElementById("editRelease");
  const release=(relEl?relEl.value:(EDIT.release||"")).trim();
  const contact=(EDIT.contact||"").trim(), phone=(EDIT.phone||"").trim();
  const maps=(EDIT.maps||"").trim(), driver=(EDIT.driver||"").trim();
  const note=(EDIT.note||"").trim();     // Marleys' column, carried on the local job only
  const notes=(EDIT.notes||"").trim();   // our team note → written to "Notes"
  const tag=(EDIT.tag||"").trim();
  const dateISO=EDIT.date?isoDate(EDIT.date):"";
  const tipDate=EDIT.date;
  const services=EDIT.services.map(s=>({...s}));
  const oldIds=(EDIT.origIds||[]).slice();
  const newMeta=sheetMeta(newKey);

  closeEditor();
  // optimistic: drop old local jobs, add new ones under the new transporter
  STATE.jobs=STATE.jobs.filter(j=>!oldIds.includes(j.id));
  services.forEach(sv=>{
    const tmin=parseTimeMin(sv.time);
    sv._tempId="tmp"+Math.random().toString(36).slice(2,9);
    STATE.jobs.push({ id:sv._tempId, sheetKey:newKey, url:newUrl, site, release, contact, phone, maps,
      status:"", driver, note, notes, tag, commodity:sv.commodity, grade:sv.grade, grid:+sv.grid, duration:+sv.duration,
      apptStatus:sv.apptStatus||"Pencilled", tipDate, tipMin:tmin, arrived:false });
  });
  render(); toast(`Moving to ${newMeta.name}…`);

  const writes=[];
  // delete old rows from the old sheet
  oldIds.forEach(id=> writes.push(postAction(oldUrl,{action:"delete",id})));
  // create on the new sheet
  services.forEach(sv=>{
    const fields={ site, release, contact, phone, maps, driver, notes, tag, tipDate:dateISO, tipTime:sv.time,
      grid:String(sv.grid), duration:String(sv.duration), commodity:sv.commodity, grade:sv.grade,
      apptStatus:sv.apptStatus||"Pencilled", transporter:newKey };
    writes.push(postAction(newUrl,{action:"create",fields}).then(r=>{
      if(r&&r.ok&&r.id){ const t=STATE.jobs.find(x=>x.id===sv._tempId); if(t) t.id=r.id; } return r; }));
  });
  if(site){ saveGrower(newUrl,{ site, release, contact, phone, maps, driver,
    commodity:(services[0]&&services[0].commodity)||"", grade:(services[0]&&services[0].grade)||"" }); }
  Promise.all(writes).then(rs=>{ rs.every(r=>r&&r.ok)?toast(`Moved to ${newMeta.name}`):(toast("Move incomplete — refreshing",true),loadAll()); })
    .catch(()=>{ toast("Move failed — refreshing",true); loadAll(); });
}

function cancelAppt(){
  if(!confirm("Cancel this load? It stays on record (struck through) but is marked Cancelled.")) return;
  const url=EDIT.url;
  const ids=EDIT.origIds.slice();
  // optimistic: mark cancelled locally (don't remove)
  ids.forEach(id=>{ const j=STATE.jobs.find(x=>x.id===id); if(j) j.apptStatus="Cancelled"; });
  closeEditor();
  render();
  toast("Cancelling…");
  Promise.all(ids.map(id=>postAction(url,{action:"update",id,fields:{apptStatus:"Cancelled"}}))).then(results=>{
    const ok=results.every(r=>r&&r.ok);
    if(ok){ toast("Load cancelled"); } else { toast("Couldn't cancel — refreshing", true); loadAll(); }
  }).catch(()=>{ toast("Couldn't cancel — refreshing", true); loadAll(); });
}

/* permanently REMOVE a load — deletes its row(s) from the sheet (not kept on record) */
function deleteAppt(){
  const n=EDIT.origIds.length;
  if(!confirm(`Delete this load completely?\n\nIt will be removed from the Grainboard and the spreadsheet (not kept on record). This can't be undone.`)) return;
  const url=EDIT.url;
  const ids=EDIT.origIds.slice();
  // optimistic: remove locally
  STATE.jobs=STATE.jobs.filter(j=>!ids.includes(j.id));
  closeEditor();
  render();
  toast("Deleting…");
  Promise.all(ids.map(id=>postAction(url,{action:"delete",id}))).then(results=>{
    const ok=results.every(r=>r&&r.ok);
    if(ok){ toast("Load deleted"); } else { toast("Couldn't delete — refreshing", true); loadAll(); }
  }).catch(()=>{ toast("Delete failed — refreshing", true); loadAll(); });
}

// prev/next move by 1 day in day view, 1 week in week view
document.getElementById("prev").onclick=()=>{
  if(STATE.view==="day"){ STATE.dayDate=addDays(STATE.dayDate,-1); }
  else { STATE.weekStart=addDays(STATE.weekStart,-7); }
  render();
};
document.getElementById("next").onclick=()=>{
  if(STATE.view==="day"){ STATE.dayDate=addDays(STATE.dayDate,1); }
  else { STATE.weekStart=addDays(STATE.weekStart,7); }
  render();
};

  STATE.dayDate=new Date();
  STATE.weekStart=startOfWeek(new Date());
  render();
};
/* ---------- day / week toggle ---------- */
function setView(v){
  STATE.view=v;
  document.getElementById("viewWeek").classList.toggle("on", v==="week");
  document.getElementById("viewDay").classList.toggle("on", v==="day");
  // entering day view: default to the day in the middle of the shown week (or today)
  if(v==="day"){
    const t=new Date();
    const inWeek = t>=STATE.weekStart && t<addDays(STATE.weekStart,7);
    STATE.dayDate = inWeek ? t : new Date(STATE.weekStart);
  } else {
    STATE.weekStart = startOfWeek(STATE.dayDate);
  }
  render();
}
document.getElementById("viewWeek").onclick=()=>setView("week");
document.getElementById("viewDay").onclick=()=>setView("day");

document.getElementById("next").title="Next";

/* ---------- simple access gate (keeps the casual/public out) ----------
   NOTE: this is a shared-password speed bump, NOT real security — the page
   source is readable by anyone who opens dev tools. It stops someone who just
   has the link. Once entered, the device stays unlocked until its cache clears. */
const ACCESS_PASSWORD = "DGgrainboard";           // <-- the shared password
const ACCESS_KEY = "grainboard_unlocked_v1";
function isUnlocked(){
  try{ return localStorage.getItem(ACCESS_KEY)==="1"; }catch(e){ return false; }
}
function unlock(){ try{ localStorage.setItem(ACCESS_KEY,"1"); }catch(e){} }
function showGate(){
  const g=document.createElement("div");
  g.id="accessGate";
  g.innerHTML=`
    <div class="gate-card">
      <div class="gate-logo">Demeter Grainboard</div>
      <div class="gate-sub">Enter the team password to continue</div>
      <input id="gatePw" type="password" autocomplete="off" placeholder="Password"
             onkeydown="if(event.key==='Enter')tryUnlock()">
      <button onclick="tryUnlock()">Enter</button>
      <div id="gateErr" class="gate-err"></div>
    </div>`;
  document.body.appendChild(g);
  setTimeout(()=>{ const i=document.getElementById("gatePw"); if(i) i.focus(); },50);
}
function tryUnlock(){
  const i=document.getElementById("gatePw");
  const err=document.getElementById("gateErr");
  if(i && i.value===ACCESS_PASSWORD){
    unlock();
    const g=document.getElementById("accessGate"); if(g) g.remove();
    bootBoard();
  }else{
    if(err) err.textContent="Incorrect password";
    if(i){ i.value=""; i.focus(); }
  }
}

/* ---------- init + auto-refresh ---------- */
function bootBoard(){
  loadCustomColors();   // staff-chosen commodity colours (per browser)
  loadAll();
  setInterval(autoRefresh, 20000);
  setTimeout(()=>{ const w=document.getElementById("calwrap"); if(w) w.scrollTop=(6-DAY_START)*HOUR_PX-10; },120);
}
if(isUnlocked()){ bootBoard(); } else { showGate(); }
// auto-refresh every 20s for multi-screen use, but NEVER while someone is
// editing (popup open), dragging, or placing a duplicate/move — so a refresh
// can't yank the UI out from under them.
function autoRefresh(){
  const busy = (typeof EDIT!=="undefined" && EDIT) || drag || resize || PLACING
    || PENDING_WRITES>0   // don't reload over an in-flight write (it would revert it)
    || document.getElementById("editBackdrop").style.display==="flex";
  if(!busy) loadAll();
}
// NOTE: the 20s auto-refresh interval and first-paint scroll are started inside
// bootBoard() (after the access gate is passed), so they don't run on the gate.
document.addEventListener("visibilitychange",()=>{if(!document.hidden && isUnlocked())autoRefresh();});
</script>
