function setApptStatus(s){ syncEditFields(); EDIT.services.forEach(sv=>sv.apptStatus=s); renderEditor(); }
function addService(){
  syncEditFields();
  // new split service copies grid/time from the first, blank commodity
  const base=EDIT.services[0]||{grid:1,time:minToSheetTime(DAY_START*60),duration:DEFAULT_DUR,apptStatus:"Pencilled"};
  EDIT.services.push({ id:null, commodity:"", grade:"", grid:base.grid, time:base.time, duration:base.duration, apptStatus:base.apptStatus });
  renderEditor();
}
function removeService(idx){
  syncEditFields();
  // mark for deletion if it had an id; otherwise just drop
  const sv=EDIT.services[idx];
  if(sv.id){ EDIT._toDelete=(EDIT._toDelete||[]); EDIT._toDelete.push(sv.id); }
  EDIT.services.splice(idx,1); renderEditor();
}
function pickDate(inp){
  syncEditFields();
  // lightweight: use a hidden date input
  const d=inp.dataset.iso;
  const picker=document.createElement("input");
  picker.type="date"; picker.value=d;
  picker.style.position="fixed"; picker.style.left="-9999px";
  document.body.appendChild(picker);
  picker.onchange=()=>{
    const [y,m,dd]=picker.value.split("-").map(Number);
    EDIT.date=new Date(y,m-1,dd);
    renderEditor();
    document.body.removeChild(picker);
  };
  picker.showPicker ? picker.showPicker() : picker.click();
}

function saveAppt(){
  // for a new booking, require at least a commodity on the first service
  if(EDIT.isNew && !(EDIT.services[0] && EDIT.services[0].commodity)){
    toast("Pick a commodity first", true); return;
  }
  // transporter changed to a DIFFERENT SHEET → move the load there
  if(!EDIT.isNew && EDIT.origUrl && EDIT.url!==EDIT.origUrl){
    return moveToTransporter();
  }
  const url=EDIT.url, sheetKey=EDIT.sheetKey;
  const site=document.getElementById("editSite").value.trim();
  const relEl=document.getElementById("editRelease");
  const release=(relEl?relEl.value:(EDIT.release||"")).trim();
  const contact=(EDIT.contact||"").trim();
  const phone=(EDIT.phone||"").trim();
  const maps=(EDIT.maps||"").trim();
  const driver=(EDIT.driver||"").trim();
  const note=(EDIT.note||"").trim();
  const tag=(EDIT.tag||"").trim();
  const dateISO = EDIT.date ? isoDate(EDIT.date) : "";
  const tipDate = EDIT.date;
  const services=EDIT.services.map(s=>({...s}));
  const toDelete=(EDIT._toDelete||[]).slice();
  // capture propagation inputs NOW — closeEditor() below nulls EDIT
  const propIsNew   = !!EDIT.isNew;
  const propOrigName= (EDIT.origSite||"").trim().toLowerCase();
  const propEditedIds = new Set(EDIT.origIds||[]);
  // propagate to this grower's OTHER bookings ONLY if the user ticked the box
  // (default OFF — editing one booking must not silently rewrite the rest)
  const applyAllEl = document.getElementById("applyAllGrower");
  const propApplyAll = !!(applyAllEl && applyAllEl.checked);

  // ---- OPTIMISTIC: update local state + UI immediately, write in background ----
  // 1. apply deletes locally
  toDelete.forEach(id=>{ STATE.jobs=STATE.jobs.filter(j=>j.id!==id); });
  // 2. apply updates/creates locally
  services.forEach(sv=>{
    const tmin=parseTimeMin(sv.time);
    if(sv.id){
      const j=STATE.jobs.find(x=>x.id===sv.id);
      if(j){ j.site=site; j.release=release; j.contact=contact; j.phone=phone; j.maps=maps; j.driver=driver; j.note=note; j.tag=tag;
             j.tipDate=tipDate; j.tipMin=tmin; j.grid=+sv.grid;
             j.duration=+sv.duration; j.commodity=sv.commodity; j.grade=sv.grade; j.apptStatus=sv.apptStatus; }
    }else{
      // temporary local job until the sheet gives it a real id
      sv._tempId="tmp"+Math.random().toString(36).slice(2,9);
      STATE.jobs.push({ id:sv._tempId, sheetKey, url, site, commodity:sv.commodity, grade:sv.grade,
        release, contact, phone, maps, status:"", driver, note, tag, grid:+sv.grid, duration:+sv.duration,
        apptStatus:sv.apptStatus, tipDate, tipMin:tmin, arrived:false });
    }
  });
  closeEditor();
  render();
  toast("Saving…");

  // ---- background writes, all in PARALLEL ----
  const jobs=[];
  toDelete.forEach(id=> jobs.push(postAction(url,{action:"delete",id})));
  services.forEach(sv=>{
    const fields={ site, release, contact, phone, maps, driver, note, tag, tipDate:dateISO, tipTime:sv.time, grid:String(sv.grid),
      duration:String(sv.duration), commodity:sv.commodity, grade:sv.grade, apptStatus:sv.apptStatus,
      transporter:sheetKey };   // tag the booking type (for shared "Other" sheet)
    if(sv.id){ jobs.push(postAction(url,{action:"update",id:sv.id,fields})); }
    else{ jobs.push(postAction(url,{action:"create",fields}).then(r=>{
            // swap the temp id for the real one the sheet assigned
            if(r&&r.ok&&r.id){ const t=STATE.jobs.find(x=>x.id===sv._tempId); if(t) t.id=r.id; }
            return r;
          })); }
  });
  // remember this grower in the directory (accumulates every new grower)
  if(site){
    saveGrower(url, { site, release, contact, phone, maps, driver,
      commodity:(services[0]&&services[0].commodity)||"", grade:(services[0]&&services[0].grade)||"" });
  }
  // ---- propagate the grower edit to this grower's OTHER bookings ----
  // ONLY when the user ticked "apply to all bookings for this grower". By
  // default a save changes just THIS booking. Matches by the ORIGINAL grower
  // name (exact, case-insensitive).
  if(!propIsNew && propApplyAll){
    const origName=propOrigName;
    const editedIds=propEditedIds;
    if(origName){
      STATE.jobs.forEach(j=>{
        if(editedIds.has(j.id)) return;                 // skip the ones we just edited
        if((j.site||"").trim().toLowerCase()!==origName) return;
        if(/^tmp/.test(j.id||"")) return;               // skip not-yet-saved
        // update the grower-level details on this other booking
        j.site=site; j.release=release; j.contact=contact; j.phone=phone; j.maps=maps; j.driver=driver;
        const f={ site, release, contact, phone, maps, driver };
        jobs.push(postAction(j.url,{action:"update",id:j.id,fields:f}));
      });
    }
  }
  Promise.all(jobs).then(results=>{
    const ok=results.every(r=>r&&r.ok);
    if(ok){ toast("Saved"); }
    else{
      const bad=results.find(r=>!(r&&r.ok));
      const msg=(bad&&bad.error)?String(bad.error).slice(0,70):"check the sheet script";
      console.error("[dispatch] save failed:", results);
      toast("Didn't save — "+msg, true);
      loadAll();
    }
  }).catch(e=>{ console.error(e); toast("Save failed — "+String(e&&e.message||e).slice(0,60), true); loadAll(); });
}

/* move an existing load to a different transporter sheet:
   delete the old rows from the old sheet, create them on the new sheet */
function moveToTransporter(){
  syncEditFields();
  const newUrl=EDIT.url, newKey=EDIT.sheetKey;
  const oldUrl=EDIT.origUrl;
  const site=(document.getElementById("editSite")||{}).value?.trim?.() || EDIT.site || "";
  const relEl=document.getElementById("editRelease");
  const release=(relEl?relEl.value:(EDIT.release||"")).trim();
  const contact=(EDIT.contact||"").trim(), phone=(EDIT.phone||"").trim();
  const maps=(EDIT.maps||"").trim(), driver=(EDIT.driver||"").trim();
  const note=(EDIT.note||"").trim();
  const tag=(EDIT.tag||"").trim();
  const dateISO=EDIT.date?isoDate(EDIT.date):"";
  const tipDate=EDIT.date;
  const services=EDIT.services.map(s=>({...s}));
  const oldIds=(EDIT.origIds||[]).slice();
  const newMeta=sheetMeta(newKey);

  closeEditor();
  // optimistic: drop old local jobs, add new ones under the new transporter
  STATE.jobs=STATE.jobs.filter(j=>!oldIds.includes(j.id));
  services.forEach(sv=>{
    const tmin=parseTimeMin(sv.time);
    sv._tempId="tmp"+Math.random().toString(36).slice(2,9);
    STATE.jobs.push({ id:sv._tempId, sheetKey:newKey, url:newUrl, site, release, contact, phone, maps,
      status:"", driver, note, tag, commodity:sv.commodity, grade:sv.grade, grid:+sv.grid, duration:+sv.duration,
      apptStatus:sv.apptStatus||"Pencilled", tipDate, tipMin:tmin, arrived:false });
  });
  render(); toast(`Moving to ${newMeta.name}…`);

  const writes=[];
  // delete old rows from the old sheet
  oldIds.forEach(id=> writes.push(postAction(oldUrl,{action:"delete",id})));
  // create on the new sheet
  services.forEach(sv=>{
    const fields={ site, release, contact, phone, maps, driver, note, tag, tipDate:dateISO, tipTime:sv.time,
      grid:String(sv.grid), duration:String(sv.duration), commodity:sv.commodity, grade:sv.grade,
      apptStatus:sv.apptStatus||"Pencilled", transporter:newKey };
    writes.push(postAction(newUrl,{action:"create",fields}).then(r=>{
      if(r&&r.ok&&r.id){ const t=STATE.jobs.find(x=>x.id===sv._tempId); if(t) t.id=r.id; } return r; }));
  });
  if(site){ saveGrower(newUrl,{ site, release, contact, phone, maps, driver,
    commodity:(services[0]&&services[0].commodity)||"", grade:(services[0]&&services[0].grade)||"" }); }
  Promise.all(writes).then(rs=>{ rs.every(r=>r&&r.ok)?toast(`Moved to ${newMeta.name}`):(toast("Move incomplete — refreshing",true),loadAll()); })
    .catch(()=>{ toast("Move failed — refreshing",true); loadAll(); });
}

function cancelAppt(){
  if(!confirm("Cancel this load? It stays on record (struck through) but is marked Cancelled.")) return;
  const url=EDIT.url;
  const ids=EDIT.origIds.slice();
  // optimistic: mark cancelled locally (don't remove)
  ids.forEach(id=>{ const j=STATE.jobs.find(x=>x.id===id); if(j) j.apptStatus="Cancelled"; });
  closeEditor();
  render();
  toast("Cancelling…");
  Promise.all(ids.map(id=>postAction(url,{action:"update",id,fields:{apptStatus:"Cancelled"}}))).then(results=>{
    const ok=results.every(r=>r&&r.ok);
    if(ok){ toast("Load cancelled"); } else { toast("Couldn't cancel — refreshing", true); loadAll(); }
  }).catch(()=>{ toast("Couldn't cancel — refreshing", true); loadAll(); });
}

/* permanently REMOVE a load — deletes its row(s) from the sheet (not kept on record) */
function deleteAppt(){
  const n=EDIT.origIds.length;
  if(!confirm(`Delete this load completely?\n\nIt will be removed from the Grainboard and the spreadsheet (not kept on record). This can't be undone.`)) return;
  const url=EDIT.url;
  const ids=EDIT.origIds.slice();
  // optimistic: remove locally
  STATE.jobs=STATE.jobs.filter(j=>!ids.includes(j.id));
  closeEditor();
  render();
  toast("Deleting…");
  Promise.all(ids.map(id=>postAction(url,{action:"delete",id}))).then(results=>{
    const ok=results.every(r=>r&&r.ok);
    if(ok){ toast("Load deleted"); } else { toast("Couldn't delete — refreshing", true); loadAll(); }
  }).catch(()=>{ toast("Delete failed — refreshing", true); loadAll(); });
}

  render();
};

  else { STATE.weekStart=addDays(STATE.weekStart,7); }

};

};
/* ---------- day / week toggle ---------- */
function setView(v){
  STATE.view=v;
  document.getElementById("viewWeek").classList.toggle("on", v==="week");
  document.getElementById("viewDay").classList.toggle("on", v==="day");
  // entering day view: default to the day in the middle of the shown week (or today)
  if(v==="day"){
    const t=new Date();
    const inWeek = t>=STATE.weekStart && t<addDays(STATE.weekStart,7);
    STATE.dayDate = inWeek ? t : new Date(STATE.weekStart);
  } else {
    STATE.weekStart = startOfWeek(STATE.dayDate);
  }
  render();
}
document.getElementById("viewWeek").onclick=()=>setView("week");
document.getElementById("viewDay").onclick=()=>setView("day");

document.getElementById("next").title="Next";

/* ---------- init + auto-refresh ---------- */
loadCustomColors();   // staff-chosen commodity colours (per browser)
loadAll();
// auto-refresh every 20s for multi-screen use, but NEVER while someone is
// editing (popup open), dragging, or placing a duplicate/move — so a refresh
// can't yank the UI out from under them.
function autoRefresh(){
  const busy = (typeof EDIT!=="undefined" && EDIT) || drag || resize || PLACING
    || document.getElementById("editBackdrop").style.display==="flex";
  if(!busy) loadAll();
}
setInterval(autoRefresh, 20000); // re-sync every 20s
document.addEventListener("visibilitychange",()=>{if(!document.hidden)autoRefresh();});

/* scroll to ~6am on first paint */
window.addEventListener("load",()=>{
  setTimeout(()=>{ document.getElementById("calwrap").scrollTop=(6-DAY_START)*HOUR_PX-10; },100);
});
